name: Backfill Historical Data (FY24 + FY25)

on:
  workflow_dispatch:         # manual trigger only — this is a one-off, not scheduled

permissions:
  pages: write
  contents: write            # needed to commit data.json back to repo

concurrency:
  group: dashboard-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backfill-history:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      FINANCE_PUBLICATION_ENABLED: ${{ vars.FINANCE_PUBLICATION_ENABLED }}
      TZ: Europe/London

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Backfill FY24 + FY25 from Shopify Analytics
        env:
          SHOPIFY_STORE:         ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_CLIENT_ID:     ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: node scripts/backfill-history.js

      - name: Commit and push updated data.json
        run: node scripts/publish-data.js --files data.json
