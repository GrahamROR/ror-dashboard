name: Fetch Dashboard Data

on:
  schedule:
    - cron: '0 5 * * *'    # 5am UTC = 6am BST every day
  workflow_dispatch:         # manual trigger from GitHub Actions tab

permissions:
  contents: write            # needed to commit data.json back to repo

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch data from Shopify Analytics
        env:
          SHOPIFY_STORE:         ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_CLIENT_ID:     ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: node scripts/fetch-data.js

      - name: Commit and push updated data.json
        run: |
          git config user.name  "ror-dashboard[bot]"
          git config user.email "dashboard@rockonruby.co.uk"
          git add data.json
          git diff --staged --quiet && echo "No changes to commit" || (
            git commit -m "chore: daily update $(date -u +'%Y-%m-%d')"
            git push
          )
