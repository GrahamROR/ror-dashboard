name: Refresh marketplace financial reporting
on:
  schedule:
    # Off-hour recovery opportunities; successful sources are collected once per London day.
    - cron: '27 1,4,7,10,13,16,19,22 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish verified output (main and owner-enabled automation only)'
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
concurrency:
  group: marketplace-financial-reporting
  cancel-in-progress: false
jobs:
  refresh:
    if: github.event_name == 'workflow_dispatch' || vars.MARKETPLACE_FINANCE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Europe/London
      GH_TOKEN: ${{ github.token }}
      MARKETPLACE_FINANCE_ENABLED: ${{ vars.MARKETPLACE_FINANCE_ENABLED }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ETSY_KEYSTRING: ${{ secrets.ETSY_KEYSTRING }}
      ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
      NOTHS_TOKEN: ${{ secrets.NOTHS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check whether today’s source needs refreshing
        id: freshness
        run: node scripts/finance-refresh-needed.js marketplaces
      - name: Read, calculate and validate marketplace financial inputs
        if: ${{ steps.freshness.outputs.needed != 'false' }}
        env:
          PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish }}
        run: |
          args=()
          if [[ "$PUBLISH" != "true" ]]; then args+=(--verify); fi
          node scripts/refresh-marketplace-finance.js "${args[@]}"
