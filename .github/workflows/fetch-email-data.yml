name: Fetch Email Dashboard Data

on:
  schedule:
    - cron: '10 3 * * *'   # 10 mins after the Shopify pull, same 3am UTC window
  workflow_dispatch:         # manual trigger from GitHub Actions tab

permissions:
  pages: write
  contents: write            # needed to commit email-data.json back to repo

concurrency:
  group: email-data-json-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch-email-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      FINANCE_PUBLICATION_ENABLED: ${{ vars.FINANCE_PUBLICATION_ENABLED }}
      TZ: Europe/London

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch data from Klaviyo + Shopify
        env:
          KLAVIYO_API_KEY:       ${{ secrets.KLAVIYO_API_KEY }}
          KLAVIYO_LIST_ID:       ${{ secrets.KLAVIYO_LIST_ID }}
          SHOPIFY_STORE:         ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_CLIENT_ID:     ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: node scripts/fetch-email-data.js

      - name: Commit and push updated email-data.json
        run: node scripts/publish-data.js --files email-data.json
