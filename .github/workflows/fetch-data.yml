name: Fetch Dashboard Data

on:
  schedule:
    - cron: '0 3 * * *'    # 3am UTC = 4am BST. Even with 60min GitHub drift, lands by 5am BST at worst.
  workflow_dispatch:         # manual trigger from GitHub Actions tab

permissions:
  contents: write            # needed to commit data.json back to repo

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Europe/London      # all date commands in this job use BST/GMT automatically

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch data from Shopify Analytics
        env:
          SHOPIFY_STORE:         ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_CLIENT_ID:     ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: node scripts/fetch-data.js

      - name: Commit and push updated data.json
        run: |
          git config user.name  "ror-dashboard[bot]"
          git config user.email "dashboard@rockonruby.co.uk"
          git add data.json

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore: daily update $(date +'%Y-%m-%d %H:%M %Z')"

          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}" && git push; then
              exit 0
            fi

            echo "Push failed because the remote moved; retrying after rebase (attempt ${attempt}/3)"
            sleep $((attempt * 5))
          done

          echo "Failed to push after rebasing remote changes."
          exit 1
