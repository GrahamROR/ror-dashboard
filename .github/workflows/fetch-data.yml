name: Fetch Dashboard Data

on:
  schedule:
    - cron: '0 5 * * *'   # 5am UTC = 6am BST every day
  workflow_dispatch:        # manual trigger from GitHub Actions tab

permissions:
  contents: write           # needed to commit data.json back to repo

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scripts/package.json

      - name: Install dependencies
        run: npm install
        working-directory: scripts

      - name: Fetch Shopify + GA4 data
        env:
          SHOPIFY_STORE:    ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_TOKEN:    ${{ secrets.SHOPIFY_TOKEN }}
          GA4_PROPERTY_ID:  ${{ secrets.GA4_PROPERTY_ID }}
          GA4_CREDENTIALS:  ${{ secrets.GA4_CREDENTIALS }}
          NODE_TLS_REJECT_UNAUTHORIZED: '0'
        run: node scripts/fetch-data.js

      - name: Commit and push data.json
        run: |
          git config user.name  "ror-dashboard[bot]"
          git config user.email "dashboard@rockonruby.co.uk"
          git add data.json
          git diff --staged --quiet && echo "No changes to commit" || (
            git commit -m "chore: update dashboard data $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          )