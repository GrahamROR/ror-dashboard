name: Validate Shopify finance refresh in staging
# Deliberately no schedule and no production write. Enablement needs separate approval.
on:
  workflow_dispatch:
    inputs:
      marketplace_verify:
        description: 'Read-only marketplace API and historical-policy verification; no publication'
        type: boolean
        default: false
      performance_verify:
        description: 'Read-only Shopify Performance window checks; no publication'
        type: boolean
        default: false
  pull_request:
    types: [synchronize]
    paths:
      - finance/collect.js
      - finance/refresh.js
      - finance/publication.js
      - finance/publication-simulation.js
      - finance/pages-publication.js
      - scripts/publish-data.js
      - .github/workflows/fetch-data.yml
      - .github/workflows/finance-staging-refresh.yml
concurrency:
  group: finance-staging-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  staging-refresh:
    if: >-
      ((github.head_ref || github.ref_name) == 'codex/pr2-canonical-shopify-finance' ||
       (github.event_name == 'workflow_dispatch' && github.ref_name == 'codex/financial-foundation')) &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Europe/London
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh through existing fetch entry point (staging only)
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: node scripts/fetch-data.js --finance-staging
      - name: Validate native controls and isolated snapshot rollback
        run: node finance/validate-refresh.js
      - name: Simulate publication, failed refresh, real recovery and rollback on latest main
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: node finance/publication-simulation.js
      - name: Verify protected exports remain unchanged
        run: git diff --exit-code -- data.json dashboard2/sales-data.json ads-data.json email-data.json ltv-cac.json
      - name: Preserve staging audit and rollback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shopify-finance-staging-${{ github.run_id }}
          path: |
            finance/staging/manifest.json
            finance/staging/refresh-status.json
            finance/staging/validation.json
            finance/staging/publication-simulation.json
            finance/staging/snapshots/
          retention-days: 30
  marketplace-source-check:
    if: github.event_name == 'workflow_dispatch' && inputs.marketplace_verify && (github.ref_name == 'main' || github.ref_name == 'codex/automatic-marketplace-finance')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Europe/London
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ETSY_KEYSTRING: ${{ secrets.ETSY_KEYSTRING }}
      ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
      NOTHS_TOKEN: ${{ secrets.NOTHS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify native source components against retained reporting controls
        run: node scripts/refresh-marketplace-finance.js --verify
      - name: Verify publication files remain unchanged
        run: git diff --exit-code -- finance/staging finance/marketplaces/staging data.json dashboard2/sales-data.json ads-data.json email-data.json ltv-cac.json

  performance-source-check:
    if: github.event_name == 'workflow_dispatch' && inputs.performance_verify && (github.ref_name == 'main' || github.ref_name == 'codex/performance-tab')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Europe/London
      SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
      SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
      SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify direct Performance queries against canonical window controls
        env:
          PERFORMANCE_EVIDENCE_PATH: ${{ runner.temp }}/performance-validation.json
        run: node scripts/verify-performance.js
      - name: Verify publication files remain unchanged
        run: git diff --exit-code -- finance/staging finance/marketplaces/staging data.json dashboard2/sales-data.json ads-data.json email-data.json ltv-cac.json
      - uses: actions/upload-artifact@v4
        with:
          name: shopify-performance-verification-${{ github.run_id }}
          path: ${{ runner.temp }}/performance-validation.json
          retention-days: 7
