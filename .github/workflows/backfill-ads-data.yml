name: Backfill Paid Ads History

on:
  workflow_dispatch:         # manual trigger only — one-off historical bootstrap
    inputs:
      days:
        description: 'How many days of history to pull'
        required: false
        default: '400'
      force:
        description: 'Overwrite days already on file'
        required: false
        default: false
        type: boolean

permissions:
  contents: write            # needed to commit ads-data.json back to repo

jobs:
  backfill-ads-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Europe/London

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Backfill Meta + Google Ads daily history
        env:
          META_ACCESS_TOKEN:           ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID:           ${{ secrets.META_AD_ACCOUNT_ID }}
          GOOGLE_ADS_DEVELOPER_TOKEN:   ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_CLIENT_ID:         ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET:     ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN:     ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_CUSTOMER_ID:       ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
        run: node scripts/backfill-ads-data.js "${{ inputs.days }}" ${{ inputs.force && '--force' || '' }}

      - name: Commit and push updated ads-data.json
        run: |
          git config user.name  "ror-dashboard[bot]"
          git config user.email "dashboard@rockonruby.co.uk"
          git add ads-data.json
          git diff --staged --quiet && echo "No changes to commit" || (
            git commit -m "chore: backfill paid ads history"
            git push
          )
