name: Dashboard reporting checks
on:
  pull_request:
    paths:
      - 'index.html'
      - 'finance/**'
      - 'scripts/fetch-data.js'
      - 'scripts/publish-data.js'
      - '.github/workflows/**'
      - '.github/workflows/finance-staging-refresh.yml'
      - 'dashboard2/**'
      - 'ads/**'
      - 'insights/**'
      - 'growth/**'
      - 'docs/growth-targets/**'
      - 'docs/pr2/**'
      - '.github/workflows/finance-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reporting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record checked-out daily exports before tests
        run: sha256sum data.json dashboard2/sales-data.json ads-data.json email-data.json ltv-cac.json > "$RUNNER_TEMP/reporting-exports.sha256"
      - run: node --test finance/test/*.test.js growth/test/*.test.js
        env:
          REPORTING_EXPORT_BASELINE: ${{ runner.temp }}/reporting-exports.sha256
      - run: node finance/reconcile.js
      - run: git diff --exit-code -- docs/pr2/reconciliation.json docs/pr2/reconciliation.md
      - run: node dashboard2/test/calculations.test.js
      - run: node dashboard2/test/reporting-contract.test.js
      - run: node dashboard2/test/date-controls.test.js
      - run: node ads/test/calculations.test.js
      - run: node insights/test/rules.test.js
