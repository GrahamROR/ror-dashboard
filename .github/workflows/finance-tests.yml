name: Dashboard reporting checks
on:
  pull_request:
    paths:
      - 'index.html'
      - 'finance/**'
      - 'dashboard2/**'
      - 'ads/**'
      - 'insights/**'
      - 'docs/pr2/**'
      - '.github/workflows/finance-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reporting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test finance/test/finance.test.js
      - run: node finance/reconcile.js
      - run: git diff --exit-code -- docs/pr2/reconciliation.json docs/pr2/reconciliation.md
      - run: node dashboard2/test/calculations.test.js
      - run: node dashboard2/test/reporting-contract.test.js
      - run: node dashboard2/test/date-controls.test.js
      - run: node ads/test/calculations.test.js
      - run: node insights/test/rules.test.js
