name: Fetch ROR Sales Data

on:
  schedule:
    - cron: '15 3 * * *'
  workflow_dispatch:

permissions:
  pages: write
  contents: write

concurrency:
  group: dashboard2-sales-data-json-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch-ror-sales-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Europe/London
      GH_TOKEN: ${{ github.token }}
      FINANCE_PUBLICATION_ENABLED: ${{ vars.FINANCE_PUBLICATION_ENABLED }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Export commercial sales aggregates from production D1
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/fetch-ror-sales-data.js
      - name: Commit refreshed sales export
        run: node scripts/publish-data.js --files dashboard2/sales-data.json
