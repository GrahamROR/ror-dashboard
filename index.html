<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rock On Ruby — Growth Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.0.0/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:      #0d0d0d;
  --s1:      #161616;
  --s2:      #1e1e1e;
  --s3:      #262626;
  --s4:      #2e2e2e;
  --bdr:     rgba(255,255,255,0.07);
  --bdr2:    rgba(255,255,255,0.13);
  --t1:      #e2e2e2;
  --t2:      #888;
  --t3:      #555;
  --amb:     #f59e0b;
  --amb-bg:  rgba(245,158,11,0.08);
  --amb-bdr: rgba(245,158,11,0.28);
  --grn:     #22c55e;
  --grn-bg:  rgba(34,197,94,0.08);
  --grn-bdr: rgba(34,197,94,0.25);
  --red:     #ef4444;
  --red-bg:  rgba(239,68,68,0.08);
  --red-bdr: rgba(239,68,68,0.25);
  --blu:     #60a5fa;
  --blu-bg:  rgba(96,165,250,0.08);
  --blu-bdr: rgba(96,165,250,0.25);
  --pur:     #a78bfa;
  --pur-bg:  rgba(167,139,250,0.08);
  --pur-bdr: rgba(167,139,250,0.25);
  --r:       8px;
  --rlg:     12px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{background:var(--bg);color:var(--t1);font-family:'DM Sans',sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;}
button{background:transparent;border:1px solid var(--bdr2);color:var(--t1);border-radius:var(--r);padding:7px 14px;font-family:inherit;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all 0.15s;}
button:hover{background:var(--s3);}
button:disabled{opacity:0.35;cursor:not-allowed;}
input[type=text],input[type=password]{background:var(--s2);border:1px solid var(--bdr2);color:var(--t1);border-radius:var(--r);padding:9px 12px;font-family:inherit;font-size:13px;width:100%;outline:none;transition:border-color 0.15s;}
input[type=text]:focus,input[type=password]:focus{border-color:var(--amb);}
input[type=range]{-webkit-appearance:none;width:100%;height:4px;background:var(--s3);border-radius:2px;outline:none;cursor:pointer;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--amb);cursor:pointer;border:2px solid var(--bg);box-shadow:0 0 0 3px var(--amb-bdr);}
.spin{animation:spin 0.8s linear infinite;display:inline-block;}
@keyframes spin{to{transform:rotate(360deg);}}
.fi{animation:fi 0.25s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:none;}}
.card{background:var(--s1);border:1px solid var(--bdr);border-radius:var(--rlg);padding:20px;}
.mono{font-family:'DM Mono',monospace;}
.lbl{font-size:11px;color:var(--t2);text-transform:uppercase;letter-spacing:0.08em;}
.tab-bar{display:flex;gap:2px;background:var(--s2);border-radius:var(--r);padding:3px;border:1px solid var(--bdr);}
.tab{padding:5px 14px;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;border:none;background:transparent;color:var(--t2);transition:all 0.15s;}
.tab.active{background:var(--s4);color:var(--t1);}
.badge{display:inline-flex;align-items:center;gap:3px;font-size:11px;padding:2px 8px;border-radius:20px;font-weight:500;}
.bg{background:var(--grn-bg);color:var(--grn);border:1px solid var(--grn-bdr);}
.br{background:var(--red-bg);color:var(--red);border:1px solid var(--red-bdr);}
.ba{background:var(--amb-bg);color:var(--amb);border:1px solid var(--amb-bdr);}
.bb{background:var(--blu-bg);color:var(--blu);border:1px solid var(--blu-bdr);}
.bp{background:var(--pur-bg);color:var(--pur);border:1px solid var(--pur-bdr);}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--s4);border-radius:2px;}
@media(max-width:768px){
  .hide-mobile{display:none!important;}
  .grid-auto{grid-template-columns:1fr!important;}
}
</style>
</head>
<body>
<div id="root"></div>
<script>
// ── CONFIG ────────────────────────────────────────────────────
const HARDCODED_KEY = '';            // paste Anthropic key here to skip AI key entry
const MODEL         = 'claude-haiku-4-5-20251001';
const DATA_URL      = './data.json'; // served by GitHub Pages

// ── CONSTANTS ─────────────────────────────────────────────────
const GOALS = {
  sessions:   350000,
  conversion: 0.035,
  aov:        48,
  repeatRate: 0.25,
  margin:     0.45,
};

// Seasonal weights Aug→Jul (derived from real FY26 data)
const WEIGHTS = [0.074,0.067,0.060,0.117,0.142,0.106,0.063,0.077,0.056,0.067,0.070,0.061];

// Fallback data — net sales pulled directly from Shopify via MCP on May 24 2026
// Used only if data.json hasn't been generated yet by GitHub Actions
const FALLBACK = {
  updated: '2026-05-24T00:00:00Z',
  fy: 'FY26', fyLabel: 'Aug 2025 – Jul 2026',
  monthly: [
    {key:'2025-08',label:'Aug 25',revenue:20012.34,orders:563, customers:545, returning:77, sessions:null,complete:true, mtd:false,future:false},
    {key:'2025-09',label:'Sep 25',revenue:18184.71,orders:526, customers:512, returning:82, sessions:null,complete:true, mtd:false,future:false},
    {key:'2025-10',label:'Oct 25',revenue:16352.73,orders:515, customers:500, returning:94, sessions:null,complete:true, mtd:false,future:false},
    {key:'2025-11',label:'Nov 25',revenue:31514.82,orders:923, customers:883, returning:182,sessions:null,complete:true, mtd:false,future:false},
    {key:'2025-12',label:'Dec 25',revenue:37970.93,orders:1159,customers:1126,returning:175,sessions:null,complete:true, mtd:false,future:false},
    {key:'2026-01',label:'Jan 26',revenue:28760.66,orders:901, customers:863, returning:132,sessions:null,complete:true, mtd:false,future:false},
    {key:'2026-02',label:'Feb 26',revenue:16828.83,orders:538, customers:511, returning:97, sessions:null,complete:true, mtd:false,future:false},
    {key:'2026-03',label:'Mar 26',revenue:20773.86,orders:671, customers:663, returning:99, sessions:null,complete:true, mtd:false,future:false},
    {key:'2026-04',label:'Apr 26',revenue:15273.69,orders:521, customers:507, returning:70, sessions:null,complete:true, mtd:false,future:false},
    {key:'2026-05',label:'May 26',revenue:12949.52,orders:433, customers:425, returning:63, sessions:null,complete:false,mtd:true, future:false},
    {key:'2026-06',label:'Jun 26',revenue:null,    orders:null,customers:null,returning:null,sessions:null,complete:false,mtd:false,future:true},
    {key:'2026-07',label:'Jul 26',revenue:null,    orders:null,customers:null,returning:null,sessions:null,complete:false,mtd:false,future:true},
  ],
  topProducts: [
    {name:'Personalised Year Sweatshirt',                        revenue:77149.62,orders:2373},
    {name:'The ULTIMATE Mystery Bag',                            revenue:11884.45,orders:360},
    {name:'Custard Cream Connoisseur Sweatshirt',                revenue:8474.00, orders:220},
    {name:'Happy Hour Slogan Sweatshirt',                        revenue:6101.16, orders:192},
    {name:'Only Here for the Pigs in Blankets Christmas Sweatshirt',revenue:5675.35,orders:190},
    {name:'Personalised Year Unisex T-shirt',                    revenue:4740.37, orders:193},
    {name:'Personalisation on the back of the neck (+£4.95)',    revenue:4158.60, orders:759},
    {name:'My Other Job is a Dallas Cowboys Cheerleader Sweatshirt',revenue:3605.00,orders:99},
    {name:'Personalised Handwriting Cuff Sweatshirt',            revenue:3311.98, orders:77},
    {name:'Yes I Like Pina Coladas Sweatshirt',                  revenue:3200.00, orders:98},
  ],
  summary:{ytdRevenue:218622.09,ytdOrders:6750,ytdSessions:null,avgAOV:32.39,avgRepeatRate:0.147,ytdReturning:897,ytdCustomers:6098}
};

// ── HELPERS ───────────────────────────────────────────────────
const fmt  = (n,d=0)  => n==null?'—':Number(n).toLocaleString('en-GB',{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtC = (n,d=0)  => n==null?'—':'£'+fmt(n,d);
const fmtP = (n,d=1)  => n==null?'—':(n*100).toFixed(d)+'%';
const round2 = n       => Math.round(n*100)/100;

function monthlyTarget(goal, idx)  { return goal * WEIGHTS[idx]; }
function weeklyTarget(goal, idx)   { return monthlyTarget(goal,idx) / 4.33; }
function dailyTarget(goal, idx)    { const days=[31,30,31,30,31,31,28,31,30,31,30,31]; return monthlyTarget(goal,idx)/days[idx]; }
function ytdTarget(goal, completedCount) { return WEIGHTS.slice(0,completedCount).reduce((s,w)=>s+w,0)*goal; }

function status(actual, goal) {
  if (actual==null||goal==null) return 'pending';
  const r = actual/goal;
  if (r>=1.0)  return 'green';
  if (r>=0.85) return 'amber';
  return 'red';
}
function statusCol(s) {
  return s==='green'?'var(--grn)':s==='amber'?'var(--amb)':s==='red'?'var(--red)':'var(--t3)';
}
function statusBadge(s,text) {
  const cls = s==='green'?'badge bg':s==='amber'?'badge ba':s==='red'?'badge br':'badge bb';
  return {cls, text: text||(s==='green'?'on track':s==='amber'?'close':s==='red'?'off track':'pending')};
}

// ── ANTHROPIC ─────────────────────────────────────────────────
async function callClaude(prompt, key) {
  const r = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'x-api-key': key,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true',
    },
    body: JSON.stringify({
      model: MODEL, max_tokens:1024,
      messages:[{role:'user', content:prompt}]
    })
  });
  const d = await r.json();
  if (d.error) throw new Error(d.error.message);
  return d.content?.find(b=>b.type==='text')?.text||'';
}

async function getInsight(summary, goal, key) {
  const p = `You are a straight-talking business analyst for Rock On Ruby, a UK personalised clothing and accessories brand (sweatshirts, caps, accessories — all personalised with DTF print or embroidery).

FY26 Performance (Aug 2025 – Jul 2026):
- Revenue goal: £${fmt(goal)}
- YTD revenue: £${fmt(summary.ytdRevenue)} vs £${fmt(ytdTarget(goal, 9))} target (Aug–Apr complete + May MTD)
- YTD orders: ${fmt(summary.ytdOrders)}
- Avg AOV: £${summary.avgAOV} (goal: £48 — gap of £${(48-summary.avgAOV).toFixed(2)})
- Repeat rate: ${fmtP(summary.avgRepeatRate)} (goal: 25%)
- Sessions: ${summary.ytdSessions ? fmt(summary.ytdSessions)+'/year est.' : 'not yet tracked'}
- Top product: Personalised Year Sweatshirt = 31% of all revenue (concentration risk)
- Christmas (Nov+Dec): 26% of annual revenue
- Jun and Jul 2026: future months, not yet complete

Give 4 bullet points — the most important strategic insight or action for right now. Be direct, specific, commercially sharp. No fluff. Format as plain bullet points starting with •`;
  return callClaude(p, key);
}

// ── REACT APP ─────────────────────────────────────────────────
const { useState, useEffect, useMemo, useRef } = React;
const el = (t,p,...c) => React.createElement(t,p,...c);

// Mini bar chart component
function MiniBar({ months, goalRev }) {
  const maxRev = Math.max(...months.map(m=>m.revenue||0), ...months.map((_,i)=>monthlyTarget(goalRev,i)));
  const h = 36;
  return el('div', {style:{display:'flex',alignItems:'flex-end',gap:2,height:h,marginTop:8}},
    months.map((m,i) => {
      const tgt = monthlyTarget(goalRev,i);
      const rev = m.revenue||0;
      const tgtH = Math.round((tgt/maxRev)*h);
      const revH = Math.round((rev/maxRev)*h);
      const col  = m.future?'var(--s4)':rev>=tgt?'var(--grn)':rev>=tgt*0.85?'var(--amb)':'var(--red)';
      return el('div', {key:m.key, style:{flex:1,display:'flex',alignItems:'flex-end',gap:1,position:'relative'},title:`${m.label}: ${fmtC(rev)}`},
        el('div', {style:{flex:1,height:tgtH,background:'var(--s3)',borderRadius:2}}),
        !m.future && el('div', {style:{position:'absolute',left:0,right:0,bottom:0,height:revH,background:col,borderRadius:2,opacity:0.85}})
      );
    })
  );
}

// Metric card component
function MetricCard({ icon, label, actual, target, unit='', statusKey, note, accentCol }) {
  const col = statusKey==='pending'?'var(--t3)':statusCol(statusKey);
  const bd  = statusBadge(statusKey);
  return el('div', {className:'card',style:{display:'flex',flexDirection:'column',gap:0}},
    el('div', {style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}},
      el('div', {style:{display:'flex',alignItems:'center',gap:8}},
        el('div', {style:{width:28,height:28,borderRadius:6,background:accentCol+'22',display:'flex',alignItems:'center',justifyContent:'center'}},
          el('i', {className:'ti '+icon, style:{color:accentCol,fontSize:14}})
        ),
        el('div', {className:'lbl'}, label)
      ),
      el('div', {className:bd.cls}, bd.text)
    ),
    el('div', {style:{fontSize:28,fontWeight:600,color:col,fontFamily:"'DM Mono',monospace",letterSpacing:'-0.02em',lineHeight:1.1,marginBottom:4}}, actual),
    el('div', {style:{fontSize:12,color:'var(--t3)',marginBottom:note?6:0}}, 'Goal: ',
      el('span',{style:{color:'var(--t2)',fontFamily:"'DM Mono',monospace"}}, target), unit&&' '+unit
    ),
    note && el('div', {style:{fontSize:11,color:'var(--t3)',lineHeight:1.5,borderTop:'1px solid var(--bdr)',paddingTop:8,marginTop:'auto'}}, note)
  );
}

function App() {
  const [data,       setData]       = useState(null);
  const [loadErr,    setLoadErr]    = useState('');
  const [loading,    setLoading]    = useState(true);
  const [isFallback, setIsFallback] = useState(false);
  const [goalRev,    setGoalRev]    = useState(500000);
  const [activeTab,  setActiveTab]  = useState('overview');
  const [apiKey,     setApiKey]     = useState(HARDCODED_KEY);
  const [keyIn,      setKeyIn]      = useState('');
  const [showAI,     setShowAI]     = useState(false);
  const [aiLoading,  setAiLoading]  = useState(false);
  const [aiInsight,  setAiInsight]  = useState('');
  const [aiErr,      setAiErr]      = useState('');

  // Load data.json on mount
  useEffect(() => {
    fetch(DATA_URL + '?t=' + Date.now())
      .then(r => { if (!r.ok) throw new Error('not found'); return r.json(); })
      .then(d => { setData(d); setLoading(false); })
      .catch(() => {
        setData(FALLBACK);
        setIsFallback(true);
        setLoading(false);
      });
  }, []);

  // Derived values from data
  const summary      = data?.summary || {};
  const monthly      = data?.monthly || [];
  const topProducts  = data?.topProducts || [];
  const updatedAt    = data?.updated ? new Date(data.updated) : null;

  const completedCount = monthly.filter(m=>!m.future).length;
  const ytdGoal        = ytdTarget(goalRev, completedCount);
  const ytdVariance    = summary.ytdRevenue - ytdGoal;
  const ytdOnTrack     = ytdVariance >= 0;

  // Slider derived numbers
  const ordersPerDay_cur  = (goalRev / (summary.avgAOV||33)) / 365;
  const ordersPerDay_goal = (goalRev / GOALS.aov) / 365;
  const sessPerDay_cur    = ordersPerDay_cur  / (summary.avgAOV ? summary.ytdOrders/(summary.ytdSessions||400000) : 0.023);
  const sessPerDay_goal   = ordersPerDay_goal / GOALS.conversion;
  const convActual        = summary.ytdSessions ? summary.ytdOrders/summary.ytdSessions : null;

  async function runAI() {
    if (!apiKey) { setShowAI(true); return; }
    setAiLoading(true); setAiErr(''); setAiInsight('');
    try {
      const txt = await getInsight(summary, goalRev, apiKey);
      setAiInsight(txt);
    } catch(e) { setAiErr(e.message); }
    setAiLoading(false);
  }

  // ── LOADING ────────────────────────────────────────────────
  if (loading) return el('div', {style:{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:16}},
    el('div', {className:'spin', style:{width:24,height:24,border:'2px solid var(--amb)',borderTopColor:'transparent',borderRadius:'50%'}}),
    el('div', {style:{fontSize:13,color:'var(--t3)'}}, 'Loading dashboard data…')
  );

  // ── DASHBOARD ─────────────────────────────────────────────
  return el('div', {style:{minHeight:'100vh',display:'flex',flexDirection:'column'}},

    // HEADER
    el('div', {style:{background:'var(--s1)',borderBottom:'1px solid var(--bdr)',padding:'0 20px',display:'flex',alignItems:'center',justifyContent:'space-between',height:48,position:'sticky',top:0,zIndex:20}},
      el('div', {style:{display:'flex',alignItems:'center',gap:12}},
        el('div', {style:{width:8,height:8,borderRadius:'50%',background:'var(--amb)',flexShrink:0}}),
        el('div', {style:{fontWeight:600,fontSize:14,whiteSpace:'nowrap'}}, 'Rock On Ruby'),
        el('div', {className:'hide-mobile',style:{color:'var(--t3)',fontSize:12}}, '·  Growth Dashboard  ·  FY26')
      ),
      el('div', {style:{display:'flex',alignItems:'center',gap:8}},
        isFallback && el('div', {className:'badge ba hide-mobile'}, el('i',{className:'ti ti-clock'}), ' seed data'),
        updatedAt && !isFallback && el('div', {className:'hide-mobile',style:{fontSize:11,color:'var(--t3)'}},
          'Updated ' + updatedAt.toLocaleDateString('en-GB',{day:'numeric',month:'short'}) + ' ' +
          updatedAt.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})
        ),
        el('div', {className:'tab-bar'},
          [['overview','ti-layout-dashboard'],['monthly','ti-calendar'],['products','ti-package'],['margin','ti-chart-pie']].map(([t,ic])=>
            el('div', {key:t, className:'tab'+(activeTab===t?' active':''), onClick:()=>setActiveTab(t)},
              el('i', {className:'ti '+ic, style:{fontSize:13}}),
              el('span', {className:'hide-mobile', style:{marginLeft:5}}, t.charAt(0).toUpperCase()+t.slice(1))
            )
          )
        )
      )
    ),

    // CONTENT
    el('div', {style:{flex:1,padding:'16px 20px',maxWidth:1200,margin:'0 auto',width:'100%'},className:'fi'},

      // ── SLIDER ──────────────────────────────────────────────
      el('div', {className:'card',style:{marginBottom:16}},
        // Top row
        el('div', {style:{display:'flex',alignItems:'flex-start',justifyContent:'space-between',flexWrap:'wrap',gap:12,marginBottom:16}},
          el('div', null,
            el('div', {className:'lbl',style:{marginBottom:4}}, 'Revenue goal — drag to explore'),
            el('div', {style:{fontSize:34,fontWeight:700,color:'var(--amb)',fontFamily:"'DM Mono',monospace",letterSpacing:'-0.02em',lineHeight:1}},
              goalRev>=1000000 ? '£'+(goalRev/1000000).toFixed(2)+'m' : '£'+(goalRev/1000).toFixed(0)+'k'
            )
          ),
          el('div', {style:{display:'flex',gap:16,flexWrap:'wrap'}},
            [
              ['YTD actual',  fmtC(summary.ytdRevenue), ytdOnTrack?'var(--grn)':'var(--red)'],
              ['YTD target',  fmtC(ytdGoal),            'var(--t2)'],
              ['YTD gap',     (ytdVariance>=0?'+':'')+fmtC(Math.abs(ytdVariance)), ytdOnTrack?'var(--grn)':'var(--red)'],
            ].map(([lbl,val,col],i)=>
              el('div', {key:i,style:{textAlign:'right'}},
                el('div', {className:'lbl'}, lbl),
                el('div', {style:{fontSize:18,fontWeight:600,color:col,fontFamily:"'DM Mono',monospace",marginTop:2}}, val)
              )
            )
          )
        ),

        // Slider
        el('input', {type:'range',min:150000,max:800000,step:5000,value:goalRev,onChange:e=>setGoalRev(+e.target.value),style:{marginBottom:6}}),
        el('div', {style:{display:'flex',justifyContent:'space-between',fontSize:11,color:'var(--t3)',marginBottom:16}},
          ['£150k','£250k','£350k','£450k','£550k','£650k','£800k'].map(l=>el('span',{key:l},l))
        ),

        // What the goal means
        el('div', {style:{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(160px,1fr))',gap:10}},
          [
            {lbl:'Monthly avg',     val:fmtC(goalRev/12,0),         sub:'Peak: '+fmtC(goalRev*WEIGHTS[3],0)+' (Nov)'},
            {lbl:'Weekly avg',      val:fmtC(goalRev/52,0),         sub:'Flat weekly average'},
            {lbl:'Daily avg',       val:fmtC(goalRev/365,0),        sub:'Every day of the year'},
            {lbl:'Orders/day @'+fmtC(summary.avgAOV||33)+' AOV', val:ordersPerDay_cur.toFixed(1), sub:ordersPerDay_goal.toFixed(1)+' orders/day @ £'+GOALS.aov+' goal', col:'var(--amb)'},
            {lbl:'Sessions/day needed', val:fmt(Math.round(sessPerDay_goal)), sub:'At 3.5% conv · '+fmt(Math.round(sessPerDay_cur))+' at current', col:'var(--blu)'},
          ].map((item,i)=>
            el('div', {key:i,style:{background:'var(--s2)',borderRadius:'var(--r)',padding:'12px 14px',border:'1px solid var(--bdr)'}},
              el('div', {className:'lbl',style:{marginBottom:5}}, item.lbl),
              el('div', {style:{fontSize:20,fontWeight:600,color:item.col||'var(--t1)',fontFamily:"'DM Mono',monospace",marginBottom:2}}, item.val),
              el('div', {style:{fontSize:11,color:'var(--t3)',lineHeight:1.4}}, item.sub)
            )
          )
        ),

        // Mini chart
        el('div', {style:{marginTop:14,paddingTop:14,borderTop:'1px solid var(--bdr)'}},
          el('div', {className:'lbl',style:{marginBottom:4}}, 'Monthly revenue vs target  ',
            el('span',{style:{color:'var(--grn)',fontWeight:400}}, '█ actual'),
            '  ',el('span',{style:{color:'var(--s4)',fontWeight:400}}, '░ target')
          ),
          el(MiniBar, {months:monthly, goalRev})
        )
      ),

      // ══ OVERVIEW ════════════════════════════════════════════
      activeTab==='overview' && el('div', {className:'fi'},

        // Metric cards
        el('div', {style:{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(170px,1fr))',gap:12,marginBottom:16},className:'grid-auto'},

          el(MetricCard, {
            icon:'ti-current-location', label:'Sessions', accentCol:'var(--blu)',
            actual: summary.ytdSessions ? fmt(summary.ytdSessions) : 'Not tracked',
            target: fmt(GOALS.sessions), unit:'/year',
            statusKey: summary.ytdSessions ? status(summary.ytdSessions, GOALS.sessions) : 'pending',
            note: summary.ytdSessions ? null : 'GA4 pipeline active — sessions appear after first nightly run',
          }),

          el(MetricCard, {
            icon:'ti-percentage', label:'Conversion', accentCol:'var(--pur)',
            actual: convActual ? fmtP(convActual) : '—',
            target: fmtP(GOALS.conversion),
            statusKey: convActual ? status(convActual, GOALS.conversion) : 'pending',
            note: convActual ? null : 'Requires sessions data — available once GA4 pipeline runs',
          }),

          el(MetricCard, {
            icon:'ti-receipt', label:'Avg Order Value', accentCol:'var(--grn)',
            actual: fmtC(summary.avgAOV,2), target: fmtC(GOALS.aov),
            statusKey: status(summary.avgAOV, GOALS.aov),
            note: 'Gap: '+fmtC(GOALS.aov - (summary.avgAOV||0), 2)+' · Revenue impact at current volume: +'+fmtC(((GOALS.aov-(summary.avgAOV||33))*summary.ytdOrders),0),
          }),

          el(MetricCard, {
            icon:'ti-refresh', label:'Repeat Rate', accentCol:'var(--amb)',
            actual: fmtP(summary.avgRepeatRate), target: fmtP(GOALS.repeatRate),
            statusKey: status(summary.avgRepeatRate, GOALS.repeatRate),
            note: fmt(summary.ytdReturning)+' returning of '+fmt(summary.ytdCustomers)+' customers YTD',
          }),

          el(MetricCard, {
            icon:'ti-currency-pound', label:'Revenue YTD', accentCol:'var(--grn)',
            actual: fmtC(summary.ytdRevenue,0), target: fmtC(ytdGoal,0),
            statusKey: status(summary.ytdRevenue, ytdGoal*0.9),
            note: 'Aug 25 – May 26 · FY goal: '+fmtC(goalRev,0),
          }),

        ),

        // AI analysis
        el('div', {className:'card'},
          el('div', {style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:aiInsight||showAI?16:0,flexWrap:'wrap',gap:10}},
            el('div', null,
              el('div', {style:{fontWeight:500,fontSize:14}}, 'AI Strategic Analysis'),
              el('div', {style:{fontSize:12,color:'var(--t2)',marginTop:2}}, 'Claude analyses your numbers and tells you where to focus')
            ),
            el('div', {style:{display:'flex',gap:8,alignItems:'center'}},
              !HARDCODED_KEY && !apiKey && el('button', {
                onClick:()=>setShowAI(v=>!v),
                style:{fontSize:12,padding:'5px 12px'}
              }, el('i',{className:'ti ti-key'}), ' Set API key'),
              el('button', {
                onClick:runAI, disabled:aiLoading,
                style:{background:aiLoading?'transparent':'var(--amb-bg)',color:aiLoading?'var(--t3)':'var(--amb)',borderColor:aiLoading?'var(--bdr)':'var(--amb-bdr)'}
              },
                aiLoading ? el('span',{className:'spin'},'⟳') : el('i',{className:'ti ti-cpu'}),
                aiLoading ? ' Analysing…' : ' Get insight'
              )
            )
          ),

          // API key input
          showAI && !apiKey && el('div', {style:{marginBottom:12,display:'flex',gap:8}},
            el('input', {type:'password',placeholder:'sk-ant-...',value:keyIn,onChange:e=>setKeyIn(e.target.value),onKeyDown:e=>e.key==='Enter'&&(setApiKey(keyIn),setShowAI(false)),style:{maxWidth:340}}),
            el('button', {onClick:()=>{setApiKey(keyIn);setShowAI(false);},style:{whiteSpace:'nowrap'}}, 'Save & run')
          ),

          aiErr && el('div', {style:{fontSize:12,color:'var(--red)',padding:'10px 14px',background:'var(--red-bg)',borderRadius:'var(--r)',border:'1px solid var(--red-bdr)'}}, aiErr),
          aiInsight && el('div', {style:{fontSize:13,color:'var(--t1)',lineHeight:1.8,whiteSpace:'pre-wrap',padding:14,background:'var(--s2)',borderRadius:'var(--r)',border:'1px solid var(--bdr2)'}}, aiInsight),
          !aiInsight && !aiLoading && !showAI && el('div', {style:{fontSize:12,color:'var(--t3)',padding:'20px 0',textAlign:'center'}},
            'Click "Get insight" to analyse your FY26 performance against the ',fmtC(goalRev,0),' goal.'
          )
        )
      ),

      // ══ MONTHLY ═════════════════════════════════════════════
      activeTab==='monthly' && el('div', {className:'fi'},
        el('div', {className:'card'},
          el('div', {style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16,flexWrap:'wrap',gap:10}},
            el('div', null,
              el('div', {style:{fontWeight:500,fontSize:14}}, 'FY26 Monthly Performance'),
              el('div', {style:{fontSize:12,color:'var(--t2)',marginTop:2}}, 'Aug 2025 – Jul 2026  ·  Target scales with goal slider above')
            ),
            el('div', {style:{display:'flex',gap:6,flexWrap:'wrap'}},
              [['on track','bg'],['close','ba'],['off track','br'],['future','bb']].map(([l,c])=>
                el('div', {key:l,className:'badge '+c}, l)
              )
            )
          ),
          el('div', {style:{overflowX:'auto'}},
            el('table', {style:{width:'100%',borderCollapse:'collapse',fontSize:13,minWidth:600}},
              el('thead', null,
                el('tr', {style:{borderBottom:'1px solid var(--bdr2)',background:'var(--s2)'}},
                  ['Month','Revenue','Target','Variance','Orders','AOV','Repeat rate','Status'].map((h,i)=>
                    el('th', {key:i,style:{padding:'8px 12px',textAlign:i===0?'left':'right',fontSize:10,textTransform:'uppercase',letterSpacing:'0.07em',color:'var(--t2)',whiteSpace:'nowrap',fontWeight:500}},h)
                  )
                )
              ),
              el('tbody', null,
                monthly.map((m,i)=>{
                  const tgt  = monthlyTarget(goalRev, i);
                  const aov  = m.orders ? round2(m.revenue/m.orders) : null;
                  const rr   = m.customers ? round2(m.returning/m.customers) : null;
                  const vari = m.revenue!=null ? m.revenue-tgt : null;
                  const st   = m.future?'future': m.mtd?'mtd': status(m.revenue, tgt*0.9);
                  const varCol = vari==null?'var(--t3)':vari>=0?'var(--grn)':'var(--red)';
                  return el('tr', {key:m.key,style:{borderBottom:'1px solid var(--bdr)',opacity:m.future?0.4:1,background:i%2?'transparent':'var(--s2)11'}},
                    el('td', {style:{padding:'9px 12px',fontWeight:500}},
                      m.label,
                      m.mtd&&el('span',{style:{fontSize:10,color:'var(--amb)',marginLeft:6,fontWeight:400}},'MTD'),
                      m.future&&el('span',{style:{fontSize:10,color:'var(--t3)',marginLeft:6,fontWeight:400}},'future')
                    ),
                    el('td',{style:{padding:'9px 12px',textAlign:'right',fontFamily:"'DM Mono',monospace",color:'var(--t1)'}}, m.revenue!=null?fmtC(m.revenue,0):'—'),
                    el('td',{style:{padding:'9px 12px',textAlign:'right',fontFamily:"'DM Mono',monospace",color:'var(--t2)'}}, fmtC(tgt,0)),
                    el('td',{style:{padding:'9px 12px',textAlign:'right',fontFamily:"'DM Mono',monospace",color:varCol}},
                      vari!=null?(vari>=0?'+':'')+fmtC(Math.abs(vari),0):'—'),
                    el('td',{style:{padding:'9px 12px',textAlign:'right',color:'var(--t2)'}}, m.orders!=null?fmt(m.orders):'—'),
                    el('td',{style:{padding:'9px 12px',textAlign:'right',fontFamily:"'DM Mono',monospace",color:'var(--t2)'}}, aov?fmtC(aov,2):'—'),
                    el('td',{style:{padding:'9px 12px',textAlign:'right',color:'var(--t2)'}}, rr?fmtP(rr):'—'),
                    el('td',{style:{padding:'9px 12px',textAlign:'right'}},
                      m.future?el('span',{style:{fontSize:11,color:'var(--t3)'}},'—'):
                      m.mtd   ?el('div',{className:'badge ba'},el('i',{className:'ti ti-clock',style:{fontSize:10}}),' MTD'):
                      st==='green'?el('div',{className:'badge bg'},'✓ on track'):
                      st==='amber'?el('div',{className:'badge ba'},'close'):
                               el('div',{className:'badge br'},'off track')
                    )
                  );
                })
              ),
              el('tfoot', null,
                el('tr', {style:{borderTop:'1px solid var(--bdr2)',background:'var(--s2)',fontWeight:600}},
                  el('td',{style:{padding:'9px 12px'}}, 'YTD Total'),
                  el('td',{style:{padding:'9px 12px',textAlign:'right',fontFamily:"'DM Mono',monospace",color:ytdOnTrack?'var(--grn)':'var(--red)'}}, fmtC(summary.ytdRevenue,0)),
                  el('td',{style:{padding:'9px 12px',textAlign:'right',fontFamily:"'DM Mono',monospace",color:'var(--t2)'}}, fmtC(ytdGoal,0)),
                  el('td',{style:{padding:'9px 12px',textAlign:'right',fontFamily:"'DM Mono',monospace",color:ytdOnTrack?'var(--grn)':'var(--red)'}},
                    (ytdVariance>=0?'+':'')+fmtC(Math.abs(ytdVariance),0)),
                  el('td',{style:{padding:'9px 12px',textAlign:'right',color:'var(--t2)'}}, fmt(summary.ytdOrders)),
                  el('td',{style:{padding:'9px 12px',textAlign:'right',fontFamily:"'DM Mono',monospace",color:'var(--t2)'}}, fmtC(summary.avgAOV,2)),
                  el('td',{style:{padding:'9px 12px',textAlign:'right',color:'var(--t2)'}}, fmtP(summary.avgRepeatRate)),
                  el('td',null)
                )
              )
            )
          )
        )
      ),

      // ══ PRODUCTS ════════════════════════════════════════════
      activeTab==='products' && el('div', {className:'fi',style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}},

        el('div', {className:'card'},
          el('div', {style:{fontWeight:500,fontSize:14,marginBottom:4}}, 'Top 10 Products — FY26'),
          el('div', {style:{fontSize:12,color:'var(--t2)',marginBottom:18}}, 'By gross revenue · Updated from Shopify'),
          topProducts.map((p,i) => {
            const totalRev = topProducts.reduce((s,t)=>s+(t.revenue||0),0);
            const pct = totalRev ? (p.revenue/summary.ytdRevenue*100) : 0;
            return el('div', {key:i,style:{marginBottom:14}},
              el('div', {style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:4,gap:8}},
                el('div', {style:{fontSize:12,fontWeight:500,color:'var(--t1)',flex:1,lineHeight:1.4}}, p.name),
                el('div', {style:{display:'flex',gap:8,flexShrink:0}},
                  el('div', {style:{fontSize:12,color:'var(--amb)',fontFamily:"'DM Mono',monospace"}}, fmtC(p.revenue,0)),
                  el('div', {className:'badge ba'}, pct.toFixed(1)+'%')
                )
              ),
              el('div', {style:{height:4,background:'var(--s3)',borderRadius:2,overflow:'hidden'}},
                el('div', {style:{height:'100%',width:pct+'%',background:i===0?'var(--amb)':'var(--s4)',borderRadius:2}})
              )
            );
          })
        ),

        el('div', {style:{display:'flex',flexDirection:'column',gap:12}},
          el('div', {className:'card'},
            el('div', {style:{fontWeight:500,fontSize:14,marginBottom:4}}, 'Concentration risk'),
            el('div', {style:{fontSize:12,color:'var(--t2)',marginBottom:12}}, 'Revenue from top product'),
            el('div', {style:{fontSize:36,fontWeight:700,color:'var(--amb)',fontFamily:"'DM Mono',monospace",lineHeight:1}},
              topProducts[0] ? (topProducts[0].revenue/summary.ytdRevenue*100).toFixed(1)+'%' : '—'
            ),
            el('div', {style:{fontSize:12,color:'var(--t3)',marginTop:6,lineHeight:1.6}},
              topProducts[0]?.name + ' drives nearly a third of all revenue. The next product is 8× smaller. Evergreen hero — but a risk to manage.'
            )
          ),
          el('div', {className:'card'},
            el('div', {style:{fontWeight:500,fontSize:14,marginBottom:4}}, 'AOV gap impact'),
            el('div', {style:{fontSize:12,color:'var(--t2)',marginBottom:14}}, 'Revenue upside from closing the AOV gap'),
            el('div', {style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}},
              [
                {lbl:'Current AOV',val:fmtC(summary.avgAOV,2),col:'var(--t2)'},
                {lbl:'Goal AOV',   val:'£'+GOALS.aov,         col:'var(--grn)'},
                {lbl:'Gap',        val:fmtC(GOALS.aov-(summary.avgAOV||33),2),col:'var(--amb)'},
                {lbl:'Revenue uplift at current volume',val:'+'+fmtC((GOALS.aov-(summary.avgAOV||33))*summary.ytdOrders,0),col:'var(--grn)'},
              ].map((item,i)=>
                el('div', {key:i,style:{background:'var(--s2)',borderRadius:'var(--r)',padding:'10px 12px',border:'1px solid var(--bdr)'}},
                  el('div', {className:'lbl',style:{marginBottom:4}}, item.lbl),
                  el('div', {style:{fontSize:17,fontWeight:600,color:item.col,fontFamily:"'DM Mono',monospace"}}, item.val)
                )
              )
            )
          )
        )
      ),

      // ══ MARGIN ══════════════════════════════════════════════
      activeTab==='margin' && el('div', {className:'fi'},
        el('div', {style:{background:'var(--amb-bg)',border:'1px solid var(--amb-bdr)',borderRadius:'var(--rlg)',padding:'16px 20px',marginBottom:16,display:'flex',alignItems:'center',gap:12}},
          el('i', {className:'ti ti-lock', style:{color:'var(--amb)',fontSize:18}}),
          el('div', null,
            el('div', {style:{fontWeight:500,color:'var(--amb)',marginBottom:2}}, 'SKU cost data pending'),
            el('div', {style:{fontSize:12,color:'var(--t2)',lineHeight:1.5}},
              'This section unlocks automatically once Chloe completes the Shopify product cost upload. No code changes needed — the data populates here the next morning after costs are loaded.'
            )
          )
        ),
        el('div', {style:{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(200px,1fr))',gap:12,marginBottom:16}},
          ['Contribution margin %','Contribution £','Net contribution £','Est. remake cost £'].map((lbl,i)=>
            el('div', {key:i,className:'card',style:{opacity:0.5}},
              el('div', {className:'lbl',style:{marginBottom:8}}, lbl),
              el('div', {style:{fontSize:28,fontWeight:700,color:'var(--t3)',fontFamily:"'DM Mono',monospace"}}, '—'),
              el('div', {style:{fontSize:12,color:'var(--t3)',marginTop:6}}, 'Awaiting SKU cost data')
            )
          )
        ),
        el('div', {className:'card',style:{opacity:0.5}},
          el('div', {style:{fontWeight:500,marginBottom:12}}, 'Monthly margin breakdown'),
          el('table', {style:{width:'100%',borderCollapse:'collapse',fontSize:13}},
            el('thead', null,
              el('tr', {style:{borderBottom:'1px solid var(--bdr2)'}},
                ['Month','Revenue','Est. cost','Contribution £','Contribution %','Remake cost','Net contribution'].map((h,i)=>
                  el('th', {key:i,style:{padding:'8px 12px',textAlign:i===0?'left':'right',fontSize:10,textTransform:'uppercase',color:'var(--t3)',letterSpacing:'0.07em'}}, h)
                )
              )
            ),
            el('tbody', null,
              monthly.filter(m=>!m.future).slice(0,3).map((m,i)=>
                el('tr', {key:i,style:{borderBottom:'1px solid var(--bdr)',opacity:0.5}},
                  el('td',{style:{padding:'9px 12px',fontWeight:500}}, m.label),
                  el('td',{style:{padding:'9px 12px',textAlign:'right',fontFamily:"'DM Mono',monospace"}}, m.revenue?fmtC(m.revenue,0):'—'),
                  ...['—','—','—','—','—'].map((v,j)=>el('td',{key:j,style:{padding:'9px 12px',textAlign:'right',color:'var(--t3)'}},v))
                )
              )
            )
          ),
          el('div', {style:{textAlign:'center',padding:'20px 0 8px',fontSize:13,color:'var(--t3)'}},
            '+ 9 more months — populates once SKU costs are loaded in Shopify'
          )
        )
      )

    ), // end content

    // FOOTER
    el('div', {style:{borderTop:'1px solid var(--bdr)',padding:'10px 20px',display:'flex',alignItems:'center',justifyContent:'space-between',background:'var(--s1)'}},
      el('div', {style:{fontSize:11,color:'var(--t3)'}}, 'Rock On Ruby · Growth Dashboard · FY26 · Data refreshes daily at 6am'),
      isFallback && el('div', {className:'badge ba',style:{fontSize:10}}, 'Using seed data — run GitHub Action to populate live data')
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
