<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rock On Ruby — Growth Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.0.0/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:      #0d0d0d;
  --s1:      #161616;
  --s2:      #1e1e1e;
  --s3:      #262626;
  --s4:      #2e2e2e;
  --bdr:     rgba(255,255,255,0.07);
  --bdr2:    rgba(255,255,255,0.13);
  --t1:      #e2e2e2;
  --t2:      #888;
  --t3:      #555;
  --amb:     #f59e0b;
  --amb-bg:  rgba(245,158,11,0.08);
  --amb-bdr: rgba(245,158,11,0.28);
  --grn:     #22c55e;
  --grn-bg:  rgba(34,197,94,0.08);
  --grn-bdr: rgba(34,197,94,0.25);
  --red:     #ef4444;
  --red-bg:  rgba(239,68,68,0.08);
  --red-bdr: rgba(239,68,68,0.25);
  --blu:     #60a5fa;
  --blu-bg:  rgba(96,165,250,0.08);
  --blu-bdr: rgba(96,165,250,0.25);
  --pur:     #a78bfa;
  --pur-bg:  rgba(167,139,250,0.08);
  --pur-bdr: rgba(167,139,250,0.25);
  --r:       8px;
  --rlg:     12px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{background:var(--bg);color:var(--t1);font-family:'DM Sans',sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;}
button{background:transparent;border:1px solid var(--bdr2);color:var(--t1);border-radius:var(--r);padding:7px 14px;font-family:inherit;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all 0.15s;}
button:hover{background:var(--s3);}
button:disabled{opacity:0.35;cursor:not-allowed;}
input[type=text],input[type=password]{background:var(--s2);border:1px solid var(--bdr2);color:var(--t1);border-radius:var(--r);padding:9px 12px;font-family:inherit;font-size:13px;width:100%;outline:none;transition:border-color 0.15s;}
input[type=text]:focus,input[type=password]:focus{border-color:var(--amb);}
input[type=range]{-webkit-appearance:none;width:100%;height:4px;background:var(--s3);border-radius:2px;outline:none;cursor:pointer;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--amb);cursor:pointer;border:2px solid var(--bg);box-shadow:0 0 0 3px var(--amb-bdr);}
.spin{animation:spin 0.8s linear infinite;display:inline-block;}
@keyframes spin{to{transform:rotate(360deg);}}
.fi{animation:fi 0.25s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:none;}}
.card{background:var(--s1);border:1px solid var(--bdr);border-radius:var(--rlg);padding:20px;}
.mono{font-family:'DM Mono',monospace;}
.lbl{font-size:11px;color:var(--t2);text-transform:uppercase;letter-spacing:0.08em;}
.tab-bar{display:flex;gap:2px;background:var(--s3);border-radius:var(--r);padding:3px;border:1px solid var(--bdr2);}
.tab{padding:5px 14px;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;border:none;background:transparent;color:var(--t2);transition:all 0.15s;}
.tab.active{background:var(--s1);color:var(--amb);border:1px solid var(--amb-bdr);}
.badge{display:inline-flex;align-items:center;gap:3px;font-size:11px;padding:2px 8px;border-radius:20px;font-weight:500;}
.bg{background:var(--grn-bg);color:var(--grn);border:1px solid var(--grn-bdr);}
.br{background:var(--red-bg);color:var(--red);border:1px solid var(--red-bdr);}
.ba{background:var(--amb-bg);color:var(--amb);border:1px solid var(--amb-bdr);}
.bb{background:var(--blu-bg);color:var(--blu);border:1px solid var(--blu-bdr);}
.bp{background:var(--pur-bg);color:var(--pur);border:1px solid var(--pur-bdr);}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--s4);border-radius:2px;}
.mobile-only{display:none;}
.scroll-x-fade{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 20px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 20px),transparent);}
.scroll-x-fade::-webkit-scrollbar{display:none;}
.tab-bar-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 20px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 20px),transparent);width:fit-content;max-width:100%;}
.tab-bar-scroll::-webkit-scrollbar{display:none;}
.table-scroll-hint{display:none;}
@media(max-width:768px){
  .hide-mobile{display:none!important;}
  .mobile-only{display:block;}
  .grid-auto{grid-template-columns:1fr!important;}
  .tab-bar .tab{padding:9px 14px!important;font-size:12px!important;min-height:38px;display:flex!important;align-items:center;justify-content:center;}
  .tab-bar{padding:4px!important;}
  .table-scroll-hint{display:flex;}
}
</style>
</head>
<body>
<div id="root"></div>
<script>
// ── CONFIG ────────────────────────────────────────────────────
const HARDCODED_KEY = '';            // paste Anthropic key here to skip AI key entry
const MODEL         = 'claude-haiku-4-5-20251001';
const DATA_URL      = './data.json'; // served by GitHub Pages
const EMAIL_DATA_URL = './email-data.json'; // written nightly by fetch-email-data.js
const LTV_CAC_DATA_URL = './ltv-cac.json'; // written nightly by fetch-ltv-cac.js

// ── CONSTANTS ─────────────────────────────────────────────────
const GOALS = {
  sessions:   350000,
  conversion: 0.035,
  aov:        48,
  repeatRate: 0.25,
  margin:     0.45,
};

// Email/SMS goals — mirrors EMAIL_GOALS in scripts/fetch-email-data.js.
// Kept as a separate constant since these are channel-level rate goals,
// not whole-business ones (see KPI framework session).
const EMAIL_GOALS_CLIENT = {
  campaignConversion: 0.0007,
  aov:                48,
  repeatPurchaseRate: 0.30,
  attribution:        0.30,
  listSize:           50000,
};

// Seasonal weights Aug→Jul (derived from real FY26 data)
const WEIGHTS = [0.074,0.067,0.060,0.117,0.142,0.106,0.063,0.077,0.056,0.067,0.070,0.061];

// Fallback data — total sales pulled directly from Shopify Analytics
// Used only if data.json hasn't been generated yet by GitHub Actions
// NOTE: multi-year shape. Each fiscal year lives under years[FYKEY] and is
// never touched by the fetch script once a later year becomes current —
// currentFY tells the dashboard which block is "live".

        {key:'2025-09',label:'Sep 25',revenue:18184.71,orders:526, customers:512, returning:82, sessions:null,complete:true, mtd:false,future:false},
        {key:'2025-10',label:'Oct 25',revenue:16352.73,orders:515, customers:500, returning:94, sessions:null,complete:true, mtd:false,future:false},
        {key:'2025-11',label:'Nov 25',revenue:31514.82,orders:923, customers:883, returning:182,sessions:null,complete:true, mtd:false,future:false},
        {key:'2025-12',label:'Dec 25',revenue:37970.93,orders:1159,customers:1126,returning:175,sessions:null,complete:true, mtd:false,future:false},
        {key:'2026-01',label:'Jan 26',revenue:28760.66,orders:901, customers:863, returning:132,sessions:null,complete:true, mtd:false,future:false},
        {key:'2026-02',label:'Feb 26',revenue:16828.83,orders:538, customers:511, returning:97, sessions:null,complete:true, mtd:false,future:false},
        {key:'2026-03',label:'Mar 26',revenue:20773.86,orders:671, customers:663, returning:99, sessions:null,complete:true, mtd:false,future:false},
        {key:'2026-04',label:'Apr 26',revenue:15273.69,orders:521, customers:507, returning:70, sessions:null,complete:true, mtd:false,future:false},
        {key:'2026-05',label:'May 26',revenue:12949.52,orders:433, customers:425, returning:63, sessions:null,complete:false,mtd:true, future:false},
        {key:'2026-06',label:'Jun 26',revenue:null,    orders:null,customers:null,returning:null,sessions:null,complete:false,mtd:false,future:true},
        {key:'2026-07',label:'Jul 26',revenue:null,    orders:null,customers:null,returning:null,sessions:null,complete:false,mtd:false,future:true},
      ],
      topProducts: [
        {name:'Personalised Year Sweatshirt',                        revenue:77149.62,orders:2373},
        {name:'The ULTIMATE Mystery Bag',                            revenue:11884.45,orders:360},
        {name:'Custard Cream Connoisseur Sweatshirt',                revenue:8474.00, orders:220},
        {name:'Happy Hour Slogan Sweatshirt',                        revenue:6101.16, orders:192},
        {name:'Only Here for the Pigs in Blankets Christmas Sweatshirt',revenue:5675.35,orders:190},
        {name:'Personalised Year Unisex T-shirt',                    revenue:4740.37, orders:193},
        {name:'Personalisation on the back of the neck (+£4.95)',    revenue:4158.60, orders:759},
        {name:'My Other Job is a Dallas Cowboys Cheerleader Sweatshirt',revenue:3605.00,orders:99},
        {name:'Personalised Handwriting Cuff Sweatshirt',            revenue:3311.98, orders:77},
        {name:'Yes I Like Pina Coladas Sweatshirt',                  revenue:3200.00, orders:98},
      ],
      summary:{ytdRevenue:218622.09,ytdOrders:6750,ytdSessions:null,avgAOV:32.39,avgConversionRate:0.026,avgRepeatRate:0.147}
    }
  }
};

// Email/SMS fallback — seeded from the last live Klaviyo + Shopify pull,
// used only until the fetch-email-data.js Action has run at least once.
const EMAIL_FALLBACK = {
  updated: '2026-07-08T00:00:00Z',
  window: 'last_90_days',
  goals: { campaignConversion: 0.0007, aov: 48, repeatPurchaseRate: 0.30, attribution: 0.30, listSize: 50000 },
  summary: {
    campaignConversionRate: 0.00011, campaignAOV: 40.98, campaignRevenue90d: 2786.68, campaignRecipients90d: 591631,
    flowRevenue90d: 10383.82, flowAOV: 39.33, flowSharePct: 0.788,
    totalEmailRevenue90d: 13170.5, blendedAOV: 39.67, attribution: 0.227,
    repeatPurchaseRate: 0.168, totalStoreRevenue90d: 57921.76, listSize: null,
  },
  campaigns: [], // full list ships in email-data.json once the Action runs
  flows: [],
};

// LTV:CAC fallback — used until fetch-ltv-cac.js has run at least once
// (or if Meta/Google Ads API credentials haven't been added as GitHub
// secrets yet). Everything stays null/pending rather than fabricating
// a number. Two windows per the original brief: a rolling 12-month
// figure (the standard interim "12 month LTV"), and a cumulative
// figure using up to 3 years of history that grows into the real
// lifetime figure as more fiscal years close.
const LTV_CAC_WINDOW_FALLBACK = {
  window: { since: null, until: null, monthsUsed: 0 },
  adSpend: {
    meta:   { spend: null, source: 'not configured' },
    google: { spend: null, source: 'not configured' },
    blended: null,
  },
  customerMetrics: { avgAOV: null, ordersPerCustomer: null, marginPct: null, newCustomers: null, totalCustomers: null, totalOrders: null },
  ltv: null,
  cac: null,
  ratio: null,
};
const LTV_CAC_FALLBACK = {
  updated: null,
  rolling: LTV_CAC_WINDOW_FALLBACK,
  cumulative: { ...LTV_CAC_WINDOW_FALLBACK, window: { ...LTV_CAC_WINDOW_FALLBACK.window, monthsCap: 36 } },
  goals: { targetRatio: 3, minRatio: 1 },
};

// ── HELPERS ───────────────────────────────────────────────────
// Pulls one fiscal year's block out of the multi-year data.json and
// flattens it back into the shape the rest of the dashboard expects.
// "yesterday" (the live daily snapshot) only applies to whichever year
// is currently live — past years show no yesterday card.
function pickYear(raw, wantFY) {
  if (!raw) return null;
  const years = raw.years || {};
  const fy = (wantFY && years[wantFY]) ? wantFY : (raw.currentFY || Object.keys(years)[0]);
  const block = years[fy] || {};
  return {
    updated:     raw.updated,
    fy,
    fyLabel:     block.fyLabel || fy,
    monthly:     block.monthly || [],
    topProducts: block.topProducts || [],
    summary:     block.summary || {},
    yesterday:   fy === raw.currentFY ? (raw.yesterday || null) : null,
  };
}

const fmt  = (n,d=0)  => n==null?'—':Number(n).toLocaleString('en-GB',{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtC = (n,d=0)  => n==null?'—':'£'+fmt(n,d);
const fmtP = (n,d=1)  => n==null?'—':(n*100).toFixed(d)+'%';

// Generic click-to-sort helper for tables. type: 'string' | 'number' | 'date'
function sortRows(rows, key, dir, type) {
  return [...rows].sort((a, b) => {
    let av = a[key], bv = b[key];
    if (type === 'date') {
      av = av ? new Date(av).getTime() : -Infinity;
      bv = bv ? new Date(bv).getTime() : -Infinity;
    } else if (type === 'string') {
      av = (av || '').toLowerCase();
      bv = (bv || '').toLowerCase();
      return dir * av.localeCompare(bv);
    } else {
      av = av ?? -Infinity;
      bv = bv ?? -Infinity;
    }
    return dir * (av - bv);
  });
}

// Renders a clickable, sortable table header cell with a direction arrow
function SortableTh({ label, field, type, sort, setSort, align }) {
  const active = sort.key === field;
  return el('th', {
    onClick: () => setSort(s => s.key === field ? { key: field, dir: -s.dir } : { key: field, dir: type === 'string' ? 1 : -1 }),
    style: {
      padding:'8px 12px', textAlign: align, fontSize:10, textTransform:'uppercase',
      color: active ? 'var(--t1)' : 'var(--t3)', letterSpacing:'0.07em',
      cursor:'pointer', userSelect:'none', whiteSpace:'nowrap',
    },
  }, label + (active ? (sort.dir === 1 ? ' ▲' : ' ▼') : ''));
}
const round2 = n       => Math.round(n*100)/100;

function monthlyTarget(goal, idx)  { return goal * WEIGHTS[idx]; }
function weeklyTarget(goal, idx)   { return monthlyTarget(goal,idx) / 4.33; }
function dailyTarget(goal, idx)    { const days=[31,30,31,30,31,31,28,31,30,31,30,31]; return monthlyTarget(goal,idx)/days[idx]; }
function ytdTarget(goal, completedCount) { return WEIGHTS.slice(0,completedCount).reduce((s,w)=>s+w,0)*goal; }

function status(actual, goal) {
  if (actual==null||goal==null) return 'pending';
  const r = actual/goal;
  if (r>=1.0)  return 'green';
  if (r>=0.85) return 'amber';
  return 'red';
}
function statusCol(s) {
  return s==='green'?'var(--grn)':s==='amber'?'var(--amb)':s==='red'?'var(--red)':'var(--t3)';
}
function statusBadge(s,text) {
  const cls = s==='green'?'badge bg':s==='amber'?'badge ba':s==='red'?'badge br':'badge bb';
  return {cls, text: text||(s==='green'?'on track':s==='amber'?'close':s==='red'?'off track':'pending')};
}
function dateLabel(dateStr) {
  if (!dateStr) return 'Yesterday';
  return new Date(dateStr + 'T12:00:00Z').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'short',year:'numeric'});
}

// ── ANTHROPIC ─────────────────────────────────────────────────
async function callClaude(prompt, key) {
  const r = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'x-api-key': key,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true',
    },
    body: JSON.stringify({
      model: MODEL, max_tokens:1024,
      messages:[{role:'user', content:prompt}]
    })
  });
  const d = await r.json();
  if (d.error) throw new Error(d.error.message);
  return d.content?.find(b=>b.type==='text')?.text||'';
}

async function getInsight(summary, goal, key) {
  const p = `You are a straight-talking business analyst for Rock On Ruby, a UK personalised clothing and accessories brand (sweatshirts, caps, accessories — all personalised with DTF print or embroidery).

FY26 Performance (Aug 2025 – Jul 2026):
- Revenue goal: £${fmt(goal)}
- YTD revenue: £${fmt(summary.ytdRevenue)} vs £${fmt(ytdTarget(goal, 9))} target (Aug–Apr complete + May MTD)
- YTD orders: ${fmt(summary.ytdOrders)}
- Avg AOV: £${summary.avgAOV} (goal: £48 — gap of £${(48-summary.avgAOV).toFixed(2)})
- Repeat rate: ${fmtP(summary.avgRepeatRate)} (goal: 25%)
- Sessions: ${summary.ytdSessions ? fmt(summary.ytdSessions)+'/year est.' : 'not yet tracked'}
- Top product: Personalised Year Sweatshirt = 31% of all revenue (concentration risk)
- Christmas (Nov+Dec): 26% of annual revenue
- Jun and Jul 2026: future months, not yet complete

Give 4 bullet points — the most important strategic insight or action for right now. Be direct, specific, commercially sharp. No fluff. Format as plain bullet points starting with •`;
  return callClaude(p, key);
}

async function getEmailInsight(es, key) {
  const p = `You are a straight-talking email/SMS marketing analyst for Rock On Ruby, a UK personalised clothing and accessories brand on Klaviyo.

Last 90 days — Email/SMS program vs KPI goals:
- Campaign conversion rate (per recipient): ${fmtP(es.campaignConversionRate,3)} (goal: 0.07%) — this is per-recipient, not per-open/click, so it will look tiny next to generic "email conversion" benchmarks
- Campaign AOV: £${es.campaignAOV} · Flow AOV: £${es.flowAOV} · Blended AOV: £${es.blendedAOV} (goal: £48)
- Flow share of email revenue: ${fmtP(es.flowSharePct)} (flows £${fmt(es.flowRevenue90d)} vs campaigns £${fmt(es.campaignRevenue90d)})
- Total email+SMS revenue: £${fmt(es.totalEmailRevenue90d)} vs total store revenue £${fmt(es.totalStoreRevenue90d)} = ${fmtP(es.attribution,1)} attribution (goal: 30%)
- Repeat purchase rate: ${fmtP(es.repeatPurchaseRate,1)} (goal: 30%)
- List size: ${es.listSize ? fmt(es.listSize) : 'not tracked yet'} (goal: 50,000)

Give 4 bullet points — the most important strategic insight or action for right now, specific to what's actually weak vs strong here. Be direct and commercially sharp, no fluff. Format as plain bullet points starting with •`;
  return callClaude(p, key);
}

// ── REACT APP ─────────────────────────────────────────────────
const { useState, useEffect, useMemo, useRef } = React;
const el = (t,p,...c) => React.createElement(t,p,...c);

// Mini bar chart component
function MiniBar({ months, goalRev }) {
  const maxRev = Math.max(...months.map(m=>m.revenue||0), ...months.map((_,i)=>monthlyTarget(goalRev,i)));
  const h = 36;
  return el('div', {style:{display:'flex',alignItems:'flex-end',gap:2,height:h,marginTop:8}},
    months.map((m,i) => {
      const tgt = monthlyTarget(goalRev,i);
      const rev = m.revenue||0;
      const tgtH = Math.round((tgt/maxRev)*h);
      const revH = Math.round((rev/maxRev)*h);
      const col  = m.future?'var(--s4)':rev>=tgt?'var(--grn)':rev>=tgt*0.85?'var(--amb)':'var(--red)';
      return el('div', {key:m.key, style:{flex:1,display:'flex',alignItems:'flex-end',gap:1,position:'relative'},title:`${m.label}: ${fmtC(rev)}`},
        el('div', {style:{flex:1,height:tgtH,background:'#fff',borderRadius:2}}),
        !m.future && el('div', {style:{position:'absolute',left:0,right:0,bottom:0,height:revH,background:col,borderRadius:2,opacity:0.85}})
      );
    })
  );
}

// Metric card component
function MetricCard({ icon, label, actual, target, unit='', statusKey, note, accentCol }) {
  const col = statusKey==='pending'?'var(--t3)':statusCol(statusKey);
  const bd  = statusBadge(statusKey);
  return el('div', {className:'card',style:{display:'flex',flexDirection:'column',gap:0}},
    el('div', {style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}},
      el('div', {style:{display:'flex',alignItems:'center',gap:8}},
        el('div', {style:{width:28,height:28,borderRadius:6,background:accentCol+'22',display:'flex',alignItems:'center',justifyContent:'center'}},
          el('i', {className:'ti '+icon, style:{color:accentCol,fontSize:14}})
        ),
        el('div', {className:'lbl'}, label)
      ),
      el('div', {className:bd.cls}, bd.text)
    ),
    el('div', {style:{fontSize:28,fontWeight:600,color:col,fontFamily:"'DM Mono',monospace",letterSpacing:'-0.02em',lineHeight:1.1,marginBottom:4}}, actual),
    el('div', {style:{fontSize:12,color:'var(--t3)',marginBottom:note?6:0}}, 'Goal: ',
      el('span',{style:{color:'var(--t2)',fontFamily:"'DM Mono',monospace"}}, target), unit&&' '+unit
    ),
    note && el('div', {style:{fontSize:11,color:'var(--t3)',lineHeight:1.5,borderTop:'1px solid var(--bdr)',paddingTop:8,marginTop:'auto'}}, note)
  );
}

// Small supporting card for the Overview tab — just the two email/SMS
// numbers that roll up into the whole-business view (attribution % and
// list size). Everything else email-specific lives on the Email tab.
function ChannelMixCard({ es }) {
  const attrPct   = es.attribution != null ? Math.min(1, es.attribution / EMAIL_GOALS_CLIENT.attribution) : 0;
  const listPct   = es.listSize    != null ? Math.min(1, es.listSize / EMAIL_GOALS_CLIENT.listSize) : 0;
  const barBg     = { height: 6, background: 'var(--s3)', borderRadius: 3, overflow: 'hidden', marginBottom: 4 };
  const barFill   = pct => ({ width: (pct * 100) + '%', height: '100%', background: 'var(--blu)' });

  return el('div', { className: 'card' },
    el('div', { className: 'lbl', style: { marginBottom: 12 } }, 'Channel mix'),

    el('div', { style: { display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', marginBottom: 4 } },
      el('span', { style: { fontSize: 13, color: 'var(--t2)' } }, 'Email + SMS attribution'),
      el('span', { style: { fontSize: 20, fontWeight: 600, fontFamily: "'DM Mono',monospace" } }, es.attribution != null ? fmtP(es.attribution, 1) : '—')
    ),
    el('div', barBg, el('div', { style: barFill(attrPct) })),
    el('div', { style: { fontSize: 11, color: 'var(--t3)', marginBottom: 14 } }, 'Goal: ' + fmtP(EMAIL_GOALS_CLIENT.attribution, 0) + ' of total store revenue'),

    el('div', { style: { display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', marginBottom: 4 } },

}

// ── WHAT-IF SLIDER BAR ───────────────────────────────────────
function WhatIfBar({ monthly, summary, projCVR, setProjCVR, projAOV, setProjAOV,
                     cvrLocked, setCvrLocked, aovLocked, setAovLocked,
                     effectiveCVR, effectiveAOV, projYTD, projVsActual, projIsUp,
                     isProjecting, resetProjection, actualCVR, actualAOV }) {

  const fmtPct = v => (v * 100).toFixed(2) + '%';
  const ytdSessions = monthly.filter(m=>!m.future).reduce((s,m)=>s+(m.sessions||0),0);

  const sliderStyle = (locked) => ({
    opacity: locked ? 0.5 : 1,
    pointerEvents: locked ? 'none' : 'auto',
    flex: 1,
  });

  // Locked state always reads as amber/orange regardless of the metric's
  // own accent colour — a consistent "this is pinned" signal is easier to
  // spot at a glance (and on a small screen) than each card using its own
  // colour for two different meanings (value colour vs. lock state).
  const lockBtn = (locked, onClick) =>
    el('button', {
      onClick,
      title: locked ? 'Unlock — allow dragging' : 'Lock at this value',
      style: {
        display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 5,
        padding: '6px 10px', fontSize: 11, fontWeight: 600,
        minHeight: 38, minWidth: 38,
        border: '1.5px solid ' + (locked ? 'var(--amb)' : 'var(--bdr2)'),
        background: locked ? 'var(--amb-bg)' : 'var(--s3)',
        color: locked ? 'var(--amb)' : 'var(--t3)',
        borderRadius: 6, cursor: 'pointer', lineHeight: 1,
        flexShrink: 0,
      }
    },
    el('i', { className: 'ti ' + (locked ? 'ti-lock' : 'ti-lock-open'), style: { fontSize: 14 } }),
    el('span', { className: 'hide-mobile' }, locked ? 'Locked' : 'Unlocked')
  );

  return el('div', { className: 'card', style: { marginBottom: 16 } },
    // Header row
    el('div', { style: { display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 14, flexWrap: 'wrap', gap: 8 } },
      el('div', null,
        el('div', { className: 'lbl', style: { marginBottom: 2 } }, 'What-if modeller'),
        el('div', { style: { fontSize: 11, color: 'var(--t3)' } }, 'Sessions fixed from Shopify · drag CVR or AOV to project revenue')
      ),
      el('div', { style: { display: 'flex', alignItems: 'center', gap: 20, flexWrap: 'wrap' } },
        // Projected YTD
        el('div', { style: { textAlign: 'right' } },
          el('div', { className: 'lbl' }, isProjecting ? 'Projected YTD' : 'Actual YTD'),
          el('div', {
            style: {
              fontSize: 22, fontWeight: 700, letterSpacing: '-0.02em',
              fontFamily: "'DM Mono',monospace",
              color: isProjecting ? (projIsUp ? 'var(--grn)' : 'var(--red)') : 'var(--t1)',
            }
          }, '£' + Math.round(isProjecting ? projYTD : (summary.ytdRevenue||0)).toLocaleString('en-GB'))
        ),
        // Delta vs actual (only when projecting)
        isProjecting && el('div', { style: { textAlign: 'right' } },
          el('div', { className: 'lbl' }, 'vs actual'),
          el('div', {
            style: {
              fontSize: 18, fontWeight: 600, fontFamily: "'DM Mono',monospace",
              color: projIsUp ? 'var(--grn)' : 'var(--red)',
            }
          }, (projVsActual >= 0 ? '+' : '') + '£' + Math.abs(Math.round(projVsActual)).toLocaleString('en-GB'))
        ),
        // Reset
        isProjecting && el('button', {
          onClick: resetProjection,
          style: { fontSize: 11, padding: '5px 10px', color: 'var(--t2)', borderColor: 'var(--bdr2)' }
        }, el('i', { className: 'ti ti-refresh', style: { fontSize: 12 } }), ' Reset')
      )
    ),

    // Three columns: Sessions | CVR | AOV
    el('div', {
      className: 'grid-auto',
      style: {
        display: 'grid',
        gridTemplateColumns: '1fr 1fr 1fr',
        gap: 12,
      }
    },

      // ── Sessions (locked, always actual) ──
      el('div', { style: { background: 'var(--s2)', borderRadius: 'var(--r)', padding: '12px 14px', border: '1px solid var(--bdr)', opacity: 0.6 } },
        el('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 } },
          el('div', null,
            el('div', { className: 'lbl', style: { marginBottom: 1 } }, 'Sessions YTD'),
            el('div', { style: { fontSize: 18, fontWeight: 600, fontFamily: "'DM Mono',monospace", color: 'var(--t1)' } },
              ytdSessions ? ytdSessions.toLocaleString('en-GB') : '—'
            )
          ),
          el('div', { style: { display: 'flex', alignItems: 'center', gap: 6 } },
            el('span', { style: { fontSize: 10, color: 'var(--t3)', padding: '3px 7px', background: 'var(--s3)', borderRadius: 4 } }, 'FIXED'),
            el('i', { className: 'ti ti-lock', style: { fontSize: 13, color: 'var(--t3)' } })
          )
        ),
        el('div', { style: { fontSize: 11, color: 'var(--t3)' } }, 'Real Shopify sessions · not adjustable')
      ),

      // ── CVR slider ──
      el('div', { style: { background: 'var(--s2)', borderRadius: 'var(--r)', padding: '12px 14px', border: '1.5px solid ' + (cvrLocked ? 'var(--amb)' : 'var(--bdr)') } },
        el('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8, flexWrap: 'wrap', gap: 6 } },
          el('div', null,
            el('div', { className: 'lbl', style: { marginBottom: 1 } }, 'Conversion Rate'),
            el('div', { style: { fontSize: 18, fontWeight: 600, fontFamily: "'DM Mono',monospace", color: 'var(--pur)' } },
              fmtPct(effectiveCVR)
            )
          ),
          el('div', { style: { display: 'flex', alignItems: 'center', gap: 6 } },
            projCVR !== null && el('span', { className: 'hide-mobile', style: { fontSize: 10, color: 'var(--t3)', padding: '2px 6px', background: 'var(--s3)', borderRadius: 4 } },
              'actual ' + fmtPct(actualCVR)
            ),
            lockBtn(cvrLocked, () => setCvrLocked(l => !l))
          )
        ),
        el('div', sliderStyle(cvrLocked),
          el('input', {
            type: 'range', min: 0.005, max: 0.08, step: 0.0005,
            value: effectiveCVR,
            onChange: e => { if (!cvrLocked) setProjCVR(+e.target.value); },
            style: { width: '100%', accentColor: 'var(--pur)' }
          })
        ),
        el('div', { style: { display: 'flex', justifyContent: 'space-between', fontSize: 10, color: 'var(--t3)', marginTop: 4 } },
          el('span', null, '0.5%'), el('span', null, 'Goal: 3.5%'), el('span', null, '8%')
        )
      ),

      // ── AOV slider ──
      el('div', { style: { background: 'var(--s2)', borderRadius: 'var(--r)', padding: '12px 14px', border: '1.5px solid ' + (aovLocked ? 'var(--amb)' : 'var(--bdr)') } },
        el('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8, flexWrap: 'wrap', gap: 6 } },
          el('div', null,
            el('div', { className: 'lbl', style: { marginBottom: 1 } }, 'Avg Order Value'),
            el('div', { style: { fontSize: 18, fontWeight: 600, fontFamily: "'DM Mono',monospace", color: 'var(--grn)' } },
              '£' + effectiveAOV.toFixed(2)
            )
          ),
          el('div', { style: { display: 'flex', alignItems: 'center', gap: 6 } },
            projAOV !== null && el('span', { className: 'hide-mobile', style: { fontSize: 10, color: 'var(--t3)', padding: '2px 6px', background: 'var(--s3)', borderRadius: 4 } },
              'actual £' + actualAOV.toFixed(2)
            ),
            lockBtn(aovLocked, () => setAovLocked(l => !l))
          )
        ),
        el('div', sliderStyle(aovLocked),
          el('input', {
            type: 'range', min: 20, max: 80, step: 0.5,
            value: effectiveAOV,
            onChange: e => { if (!aovLocked) setProjAOV(+e.target.value); },
            style: { width: '100%', accentColor: 'var(--grn)' }
          })
        ),
        el('div', { style: { display: 'flex', justifyContent: 'space-between', fontSize: 10, color: 'var(--t3)', marginTop: 4 } },
          el('span', null, '£20'), el('span', null, 'Goal: £48'), el('span', null, '£80')
        )
      )
    )
  );
}

// ── EMAIL WHAT-IF SLIDER BAR ──────────────────────────────────
// Same pattern as WhatIfBar: one fixed lever (list size/recipients),
// two draggable ones (conversion rate, AOV). Projects email revenue
// and — because we know total store revenue — projected attribution %.
function EmailWhatIfBar({ es, projConv, setProjConv, projAOV, setProjAOV,
                          convLocked, setConvLocked, aovLocked, setAovLocked,
                          resetProjection }) {

  const fmtPct4 = v => (v * 100).toFixed(3) + '%';
  const recipients90d = es.campaignRecipients90d || 0;

  const actualConv = es.campaignConversionRate || 0;
  const actualAOV  = es.campaignAOV || 30;
  const effectiveConv = projConv !== null ? projConv : actualConv;
  const effectiveAOV  = projAOV  !== null ? projAOV  : actualAOV;
  const isProjecting  = projConv !== null || projAOV !== null;

  // Projected campaign revenue over the same 90-day recipient volume,
  // added back to the (fixed) flow revenue to get total projected email revenue.
  const projCampaignRevenue = recipients90d * effectiveConv * effectiveAOV;
  const projTotalEmailRevenue = projCampaignRevenue + (es.flowRevenue90d || 0);
  const projAttribution = es.totalStoreRevenue90d ? projTotalEmailRevenue / es.totalStoreRevenue90d : null;
  const actualTotalEmailRevenue = es.totalEmailRevenue90d || 0;
  const projVsActual = projTotalEmailRevenue - actualTotalEmailRevenue;
  const projIsUp = projVsActual >= 0;

  const sliderStyle = (locked) => ({ opacity: locked ? 0.5 : 1, pointerEvents: locked ? 'none' : 'auto', flex: 1 });
  const lockBtn = (locked, onClick, col) =>
    el('button', {
      onClick, title: locked ? 'Unlock' : 'Lock at this value',
      style: {
        padding: '4px 8px', fontSize: 11, border: 'none',
        background: locked ? col + '22' : 'var(--s3)', color: locked ? col : 'var(--t3)',
        borderRadius: 6, cursor: 'pointer', lineHeight: 1,
        outline: locked ? '1px solid ' + col + '55' : 'none', flexShrink: 0,
      }
    }, el('i', { className: 'ti ' + (locked ? 'ti-lock' : 'ti-lock-open'), style: { fontSize: 12 } }));

  return el('div', { className: 'card', style: { marginBottom: 16 } },
    el('div', { style: { display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 14, flexWrap: 'wrap', gap: 8 } },
      el('div', null,
        el('div', { className: 'lbl', style: { marginBottom: 2 } }, 'Email What-if modeller'),
        el('div', { style: { fontSize: 11, color: 'var(--t3)' } }, '90-day campaign recipients fixed · drag conversion or AOV to project revenue & attribution')
      ),
      el('div', { style: { display: 'flex', alignItems: 'center', gap: 20, flexWrap: 'wrap' } },
        el('div', { style: { textAlign: 'right' } },
          el('div', { className: 'lbl' }, isProjecting ? 'Projected email rev.' : 'Actual email rev.'),
          el('div', { style: { fontSize: 22, fontWeight: 700, letterSpacing: '-0.02em', fontFamily: "'DM Mono',monospace", color: isProjecting ? (projIsUp ? 'var(--grn)' : 'var(--red)') : 'var(--t1)' } },
            '£' + Math.round(isProjecting ? projTotalEmailRevenue : actualTotalEmailRevenue).toLocaleString('en-GB')
          )
        ),
        el('div', { style: { textAlign: 'right' } },
          el('div', { className: 'lbl' }, 'Attribution'),
          el('div', { style: { fontSize: 22, fontWeight: 700, letterSpacing: '-0.02em', fontFamily: "'DM Mono',monospace", color: (isProjecting ? projAttribution : es.attribution) >= EMAIL_GOALS_CLIENT.attribution ? 'var(--grn)' : 'var(--amb)' } },
            fmtP(isProjecting ? projAttribution : es.attribution, 1)
          )
        ),
        isProjecting && el('button', { onClick: resetProjection, style: { fontSize: 11, padding: '5px 10px', color: 'var(--t2)', borderColor: 'var(--bdr2)' } },
          el('i', { className: 'ti ti-refresh', style: { fontSize: 12 } }), ' Reset')
      )
    ),

    el('div', { className: 'grid-auto', style: { display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 12 } },

      // ── Recipients (fixed) ──
      el('div', { style: { background: 'var(--s2)', borderRadius: 'var(--r)', padding: '12px 14px', border: '1px solid var(--bdr)', opacity: 0.6 } },
        el('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 } },
          el('div', null,
            el('div', { className: 'lbl', style: { marginBottom: 1 } }, 'Recipients (90d)'),
            el('div', { style: { fontSize: 18, fontWeight: 600, fontFamily: "'DM Mono',monospace", color: 'var(--t1)' } }, recipients90d ? recipients90d.toLocaleString('en-GB') : '—')
          ),
          el('div', { style: { display: 'flex', alignItems: 'center', gap: 6 } },
            el('span', { style: { fontSize: 10, color: 'var(--t3)', padding: '3px 7px', background: 'var(--s3)', borderRadius: 4 } }, 'FIXED'),
            el('i', { className: 'ti ti-lock', style: { fontSize: 13, color: 'var(--t3)' } })
          )
        ),
        el('div', { style: { fontSize: 11, color: 'var(--t3)' } }, 'Real campaign send volume · not adjustable here — see List size goal card')
      ),

      // ── Conversion rate slider ──
      el('div', { style: { background: 'var(--s2)', borderRadius: 'var(--r)', padding: '12px 14px', border: '1px solid ' + (convLocked ? 'var(--pur-bdr)' : 'var(--bdr)') } },
        el('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 } },
          el('div', null,
            el('div', { className: 'lbl', style: { marginBottom: 1 } }, 'Campaign Conversion'),
            el('div', { style: { fontSize: 18, fontWeight: 600, fontFamily: "'DM Mono',monospace", color: 'var(--pur)' } }, fmtPct4(effectiveConv))
          ),
          el('div', { style: { display: 'flex', alignItems: 'center', gap: 6 } },
            projConv !== null && el('span', { style: { fontSize: 10, color: 'var(--t3)', padding: '2px 6px', background: 'var(--s3)', borderRadius: 4 } }, 'actual ' + fmtPct4(actualConv)),
            lockBtn(convLocked, () => setConvLocked(l => !l), 'var(--pur)')
          )
        ),
        el('div', sliderStyle(convLocked),
          el('input', { type: 'range', min: 0.0001, max: 0.002, step: 0.00001, value: effectiveConv,
            onChange: e => { if (!convLocked) setProjConv(+e.target.value); }, style: { width: '100%', accentColor: 'var(--pur)' } })
        ),
        el('div', { style: { display: 'flex', justifyContent: 'space-between', fontSize: 10, color: 'var(--t3)', marginTop: 4 } },
          el('span', null, '0.01%'), el('span', null, 'Goal: 0.07%'), el('span', null, '0.2%'))
      ),

      // ── AOV slider ──
      el('div', { style: { background: 'var(--s2)', borderRadius: 'var(--r)', padding: '12px 14px', border: '1px solid ' + (aovLocked ? 'var(--grn-bdr)' : 'var(--bdr)') } },
        el('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 } },
          el('div', null,
            el('div', { className: 'lbl', style: { marginBottom: 1 } }, 'Campaign AOV'),
            el('div', { style: { fontSize: 18, fontWeight: 600, fontFamily: "'DM Mono',monospace", color: 'var(--grn)' } }, '£' + effectiveAOV.toFixed(2))
          ),
          el('div', { style: { display: 'flex', alignItems: 'center', gap: 6 } },
            projAOV !== null && el('span', { style: { fontSize: 10, color: 'var(--t3)', padding: '2px 6px', background: 'var(--s3)', borderRadius: 4 } }, 'actual £' + actualAOV.toFixed(2)),
            lockBtn(aovLocked, () => setAovLocked(l => !l), 'var(--grn)')
          )
        ),
        el('div', sliderStyle(aovLocked),
          el('input', { type: 'range', min: 20, max: 80, step: 0.5, value: effectiveAOV,
            onChange: e => { if (!aovLocked) setProjAOV(+e.target.value); }, style: { width: '100%', accentColor: 'var(--grn)' } })
        ),
        el('div', { style: { display: 'flex', justifyContent: 'space-between', fontSize: 10, color: 'var(--t3)', marginTop: 4 } },
          el('span', null, '£20'), el('span', null, 'Goal: £48'), el('span', null, '£80'))
      )
    ),

    isProjecting && el('div', { style: { marginTop: 12, paddingTop: 12, borderTop: '1px solid var(--bdr)', fontSize: 11, color: 'var(--t3)', display: 'flex', justifyContent: 'space-between', flexWrap: 'wrap', gap: 8 } },
      el('span', null, 'vs actual: ', el('span', { style: { color: projIsUp ? 'var(--grn)' : 'var(--red)', fontFamily: "'DM Mono',monospace" } }, (projVsActual >= 0 ? '+' : '') + '£' + Math.abs(Math.round(projVsActual)).toLocaleString('en-GB'))),
      el('span', null, 'Flow revenue (£' + fmt(es.flowRevenue90d) + ') held constant — this models the campaign lever only')
    )
  );
}

function App() {
  const [data,       setData]       = useState(null); // raw multi-year data.json
  const [selectedFY, setSelectedFY] = useState(null);  // which year the dashboard is showing
  const [loadErr,    setLoadErr]    = useState('');
  const [loading,    setLoading]    = useState(true);
  const [isFallback, setIsFallback] = useState(false);
  const [goalRev,    setGoalRev]    = useState(500000);
  // Locked by default so every new visitor sees the same committed goal
  // rather than whatever position the slider happens to land on — it's
  // only meant to be unlocked deliberately, to explore a different figure.
  const [goalRevLocked, setGoalRevLocked] = useState(true);
  const [activeTab,  setActiveTab]  = useState('overview');
  const [campSort, setCampSort] = useState({ key: 'sendTime', dir: -1 });
  const [flowSort, setFlowSort] = useState({ key: 'revenuePerRecipient', dir: -1 });
  const [apiKey,     setApiKey]     = useState(HARDCODED_KEY);
  const [keyIn,      setKeyIn]      = useState('');
  const [showAI,     setShowAI]     = useState(false);
  const [aiLoading,  setAiLoading]  = useState(false);
  const [aiInsight,  setAiInsight]  = useState('');
  const [aiErr,      setAiErr]      = useState('');

  // ── WHAT-IF SLIDER STATE ─────────────────────────────────────
  // projCVR / projAOV default to null (= actuals). When a slider
  // is moved it gets a numeric value. Lock pins it there.
  const [projCVR,    setProjCVR]    = useState(null);
  const [projAOV,    setProjAOV]    = useState(null);
  const [cvrLocked,  setCvrLocked]  = useState(false);
  const [aovLocked,  setAovLocked]  = useState(false);

  // ── EMAIL TAB STATE ──────────────────────────────────────────
  const [emailData,        setEmailData]        = useState(null);
  const [emailIsFallback,  setEmailIsFallback]  = useState(false);
  const [projEmailConv,    setProjEmailConv]    = useState(null);
  const [projEmailAOV,     setProjEmailAOV]     = useState(null);
  const [emailConvLocked,  setEmailConvLocked]  = useState(false);
  const [emailAovLocked,   setEmailAovLocked]   = useState(false);
  const [emailAiLoading,   setEmailAiLoading]   = useState(false);
  const [emailAiInsight,   setEmailAiInsight]   = useState('');
  const [emailAiErr,       setEmailAiErr]       = useState('');

  // ── LTV:CAC STATE ────────────────────────────────────────────
  const [ltvCacData,       setLtvCacData]       = useState(null);
  const [ltvCacIsFallback, setLtvCacIsFallback] = useState(false);

  function resetEmailProjection() {
    setProjEmailConv(null); setProjEmailAOV(null);
    setEmailConvLocked(false); setEmailAovLocked(false);
  }

  async function runEmailAI() {
    if (!apiKey) { setShowAI(true); return; }
    setEmailAiLoading(true); setEmailAiErr(''); setEmailAiInsight('');
    try {
      const txt = await getEmailInsight(emailData?.summary || {}, apiKey);
      setEmailAiInsight(txt);
    } catch (e) {
      setEmailAiErr(e.message || 'Failed to get insight');
    } finally {
      setEmailAiLoading(false);
    }
  }

  // Load data.json on mount
  useEffect(() => {
    fetch(DATA_URL + '?t=' + Date.now())
      .then(r => { if (!r.ok) throw new Error('not found'); return r.json(); })
      .then(d => { setData(d); setSelectedFY(d.currentFY); setLoading(false); })
      .catch(() => {
        setData(FALLBACK);
        setSelectedFY(FALLBACK.currentFY);
        setIsFallback(true);
        setLoading(false);
      });
  }, []);

  // Years available for the selector, most recent first
  const availableYears = data?.years ? Object.keys(data.years).sort().reverse() : [];
  const viewData = useMemo(() => pickYear(data, selectedFY), [data, selectedFY]);

  // Load email-data.json on mount (independent of the main pull —
  // if this 404s, the Email tab just shows fallback numbers)
  useEffect(() => {
    fetch(EMAIL_DATA_URL + '?t=' + Date.now())
      .then(r => { if (!r.ok) throw new Error('not found'); return r.json(); })
      .then(d => setEmailData(d))
      .catch(() => { setEmailData(EMAIL_FALLBACK); setEmailIsFallback(true); });
  }, []);

  // Load ltv-cac.json on mount (independent of the other pulls —
  // if this 404s, the Margin tab's LTV:CAC card just shows pending state)
  useEffect(() => {
    fetch(LTV_CAC_DATA_URL + '?t=' + Date.now())
      .then(r => { if (!r.ok) throw new Error('not found'); return r.json(); })
      .then(d => setLtvCacData(d))
      .catch(() => { setLtvCacData(LTV_CAC_FALLBACK); setLtvCacIsFallback(true); });
  }, []);

  // Derived values from the selected year's data
  const summary      = viewData?.summary || {};
  const monthly      = viewData?.monthly || [];
  const topProducts  = viewData?.topProducts || [];
  const yesterday     = viewData?.yesterday || null;
  const updatedAt    = viewData?.updated ? new Date(viewData.updated) : null;
  const isLiveYear   = selectedFY === data?.currentFY;

  const completedCount = monthly.filter(m=>!m.future).length;
  const ytdGoal        = ytdTarget(goalRev, completedCount);
  const ytdVariance    = summary.ytdRevenue - ytdGoal;
  const ytdOnTrack     = ytdVariance >= 0;
  const yesterdayIdx   = Math.max(0, monthly.findIndex(m=>m.key===yesterday?.monthKey));
  const yRevTarget     = dailyTarget(goalRev, yesterdayIdx);
  const yOrdersTarget  = yRevTarget / GOALS.aov;
  const ySessionsTarget = dailyTarget(GOALS.sessions, yesterdayIdx);
  const yProfitTarget  = yRevTarget * GOALS.margin;

  // ── WHAT-IF DERIVED VALUES ──────────────────────────────────
  // Resolve effective CVR and AOV — slider value if set, else actual
  const actualCVR     = summary.avgConversionRate || summary.ytdOrders / (summary.ytdSessions || 1);
  const actualAOV     = summary.avgAOV || 32;
  const effectiveCVR  = projCVR !== null ? projCVR : actualCVR;
  const effectiveAOV  = projAOV !== null ? projAOV : actualAOV;
  const isProjecting  = projCVR !== null || projAOV !== null;

  // Per-month projected revenue = sessions × effectiveCVR × effectiveAOV
  // Sessions are always real Shopify numbers — never adjusted
  const projectedMonthly = monthly.map(m => ({
    ...m,
    projRevenue: m.sessions != null && !m.future
      ? Math.round(m.sessions * effectiveCVR * effectiveAOV)
      : null,
  }));

  // YTD projected total (active months only)
  const projYTD = projectedMonthly
    .filter(m => !m.future)
    .reduce((s, m) => s + (m.projRevenue || 0), 0);

  const projVsActual  = projYTD - (summary.ytdRevenue || 0);
  const projIsUp      = projVsActual >= 0;

  // Reset both sliders to actuals
  function resetProjection() { setProjCVR(null); setProjAOV(null); setCvrLocked(false); setAovLocked(false); }

  // Slider derived numbers
  const ordersPerDay_cur  = (goalRev / (summary.avgAOV||33)) / 365;
  const ordersPerDay_goal = (goalRev / GOALS.aov) / 365;
  const sessPerDay_cur    = ordersPerDay_cur  / (summary.avgAOV ? summary.ytdOrders/(summary.ytdSessions||400000) : 0.023);
  const sessPerDay_goal   = ordersPerDay_goal / GOALS.conversion;
  const convActual        = summary.avgConversionRate ?? null;

  async function runAI() {
    if (!apiKey) { setShowAI(true); return; }
    setAiLoading(true); setAiErr(''); setAiInsight('');
    try {
      const txt = await getInsight(summary, goalRev, apiKey);
      setAiInsight(txt);
    } catch(e) { setAiErr(e.message); }
    setAiLoading(false);
  }

  // ── LOADING ────────────────────────────────────────────────
  if (loading) return el('div', {style:{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:16}},
    el('div', {className:'spin', style:{width:24,height:24,border:'2px solid var(--amb)',borderTopColor:'transparent',borderRadius:'50%'}}),
    el('div', {style:{fontSize:13,color:'var(--t3)'}}, 'Loading dashboard data…')
  );

  // ── DASHBOARD ─────────────────────────────────────────────
  return el('div', {style:{minHeight:'100vh',display:'flex',flexDirection:'column'}},

    // HEADER
    el('div', {style:{background:'var(--s1)',borderBottom:'1px solid var(--bdr)',padding:'8px 16px',display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',rowGap:8,position:'sticky',top:0,zIndex:20}},
      el('div', {style:{display:'flex',alignItems:'center',gap:12,minWidth:0}},
        el('div', {style:{width:8,height:8,borderRadius:'50%',background:isFallback?'var(--amb)':'var(--grn)',flexShrink:0,boxShadow:isFallback?'0 0 0 3px var(--amb-bdr)':'0 0 0 3px var(--grn-bdr)'}}),
        el('div', {style:{fontWeight:600,fontSize:14,whiteSpace:'nowrap',flexShrink:0}}, 'Rock On Ruby'),
        el('div', {className:'hide-mobile',style:{color:'var(--t3)',fontSize:12,whiteSpace:'nowrap'}}, '·  Growth Dashboard  ·  '+(viewData?.fy||'')),
        availableYears.length > 1 && el('div', {className:'tab-bar tab-bar-scroll',style:{minWidth:0}},
          availableYears.map(fy =>
            el('button', {
              key: fy,
              className: 'tab' + (fy===selectedFY ? ' active' : ''),
              onClick: () => setSelectedFY(fy),
              style:{padding:'4px 10px',flexShrink:0}
            }, fy)
          )
        )
      ),
      el('div', {style:{display:'flex',alignItems:'center',gap:8,minWidth:0}},
        // Data freshness indicator — prominent pill on desktop; moved to its
        // own plain left-aligned line below the header on mobile instead
        // (see mobile-only block just after this header), since a floating
        // bubble squeezed into this row was the first thing to get clipped
        // on narrow screens.
        el('div', {className:'hide-mobile', style:{
          display:'flex',alignItems:'center',gap:6,
          padding:'4px 10px',borderRadius:20,
          background: isFallback ? 'var(--amb-bg)' : 'var(--grn-bg)',
          border: '1px solid ' + (isFallback ? 'var(--amb-bdr)' : 'var(--grn-bdr)'),
          fontSize:11,
          color: isFallback ? 'var(--amb)' : 'var(--grn)',
          whiteSpace:'nowrap',
        }},
          el('i', {className: isFallback ? 'ti ti-database-off' : 'ti ti-database-check', style:{fontSize:11}}),
          isFallback
            ? el('span', null, 'Embedded data · Live updates nightly at 5am BST')
            : el('span', null,
                'Live · Updated ',
                updatedAt ? updatedAt.toLocaleDateString('en-GB',{day:'numeric',month:'short'}) + ' at ' +
                updatedAt.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}) : '—'
              )
        ),
        // Labels stay visible at every width — icon-only tabs with no text
        // turned out unreadable once this row wraps onto its own line on
        // mobile: nothing to tell tabs apart, and no way to tell which page
        // is active while scrolling past the visible ones.
        el('div', {className:'tab-bar tab-bar-scroll', style:{minWidth:0}},
          [['overview','ti-layout-dashboard'],['yesterday','ti-calendar-stats'],['monthly','ti-calendar'],['products','ti-package'],['email','ti-mail'],['margin','ti-chart-pie']].map(([t,ic])=>
            el('div', {key:t, className:'tab'+(activeTab===t?' active':''), onClick:()=>setActiveTab(t), style:{flexShrink:0,whiteSpace:'nowrap'}},
              el('i', {className:'ti '+ic, style:{fontSize:13}}),
              el('span', {style:{marginLeft:5}}, t.charAt(0).toUpperCase()+t.slice(1))
            )
          )
        )
      )
    ),

    // Mobile-only current-page label — a fixed "you are here" independent of
    // where the nav tab row happens to be scrolled to, since the active tab
    // can easily be scrolled out of view on a narrow screen.
    el('div', {className:'mobile-only', style:{padding:'8px 16px 0',fontSize:15,fontWeight:600,color:'var(--t1)'}},
      activeTab.charAt(0).toUpperCase()+activeTab.slice(1)
    ),

    // Mobile-only freshness line — plain left-aligned text below the sticky
    // header, not a pill, per the mobile feedback that the header pill read
    // as an out-of-place floating bubble on small screens.
    el('div', {className:'mobile-only', style:{padding:'4px 16px 0',fontSize:11,color:isFallback?'var(--amb)':'var(--grn)',display:'flex',alignItems:'center',gap:5}},
      el('i', {className: isFallback ? 'ti ti-database-off' : 'ti ti-database-check', style:{fontSize:11}}),
      isFallback
        ? el('span', null, 'Embedded data · Live updates nightly at 5am BST')
        : el('span', null,
            'Live · Updated ',
            updatedAt ? updatedAt.toLocaleDateString('en-GB',{day:'numeric',month:'short'}) + ' at ' +
            updatedAt.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}) : '—'
          )
    ),

    // CONTENT
    el('div', {style:{flex:1,padding:'16px 20px',maxWidth:1200,margin:'0 auto',width:'100%'},className:'fi'},

      // ── WHAT-IF BAR ─────────────────────────────────────────────
      el(WhatIfBar, {
        monthly, summary,
        projCVR, setProjCVR, projAOV, setProjAOV,
        cvrLocked, setCvrLocked, aovLocked, setAovLocked,
        effectiveCVR, effectiveAOV,
        projYTD, projVsActual, projIsUp,
        isProjecting, resetProjection,
        actualCVR, actualAOV,
      }),

      // ── SLIDER ──────────────────────────────────────────────
      el('div', {className:'card',style:{marginBottom:16,border:'1.5px solid '+(goalRevLocked?'var(--amb)':'var(--bdr)')}},
        // Top row
        el('div', {style:{display:'flex',alignItems:'flex-start',justifyContent:'space-between',flexWrap:'wrap',gap:12,marginBottom:16}},
          el('div', null,
            el('div', {style:{display:'flex',alignItems:'center',gap:8,marginBottom:4,flexWrap:'wrap'}},
              el('div', {className:'lbl'}, goalRevLocked ? 'Revenue goal — locked' : 'Revenue goal — drag to explore'),
              el('button', {
                onClick: () => setGoalRevLocked(l => !l),
                title: goalRevLocked ? 'Unlock — allow dragging' : 'Lock at this value for everyone',
                style: {
                  display:'flex',alignItems:'center',justifyContent:'center',gap:5,
                  padding:'5px 9px',fontSize:10,fontWeight:600,
                  minHeight:36,minWidth:36,
                  border:'1.5px solid '+(goalRevLocked?'var(--amb)':'var(--bdr2)'),
                  background: goalRevLocked ? 'var(--amb-bg)' : 'var(--s3)',
                  color: goalRevLocked ? 'var(--amb)' : 'var(--t3)',
                  borderRadius:6,cursor:'pointer',lineHeight:1,
                }
              },
                el('i', {className:'ti '+(goalRevLocked?'ti-lock':'ti-lock-open'), style:{fontSize:13}}),
                el('span', {className:'hide-mobile'}, goalRevLocked ? 'Locked' : 'Unlocked')
              )
            ),
            el('div', {style:{fontSize:34,fontWeight:700,color:'var(--amb)',fontFamily:"'DM Mono',monospace",letterSpacing:'-0.02em',lineHeight:1}},
              goalRev>=1000000 ? '£'+(goalRev/1000000).toFixed(2)+'m' : '£'+(goalRev/1000).toFixed(0)+'k'
            )
          ),
          el('div', {style:{display:'flex',gap:16,flexWrap:'wrap'}},
            [
              ['YTD actual',  fmtC(summary.ytdRevenue), ytdOnTrack?'var(--grn)':'var(--red)'],
              ['YTD target',  fmtC(ytdGoal),            'var(--t2)'],
              ['YTD gap',     (ytdVariance>=0?'+':'')+fmtC(Math.abs(ytdVariance)), ytdOnTrack?'var(--grn)':'var(--red)'],
            ].map(([lbl,val,col],i)=>
              el('div', {key:i,style:{textAlign:'right'}},
                el('div', {className:'lbl'}, lbl),
                el('div', {style:{fontSize:18,fontWeight:600,color:col,fontFamily:"'DM Mono',monospace",marginTop:2}}, val)
              )
            )
          )
        ),

        // Slider
        el('input', {
          type:'range',min:150000,max:800000,step:5000,value:goalRev,
          onChange:e=>{ if(!goalRevLocked) setGoalRev(+e.target.value); },
          style:{marginBottom:6,opacity:goalRevLocked?0.5:1,pointerEvents:goalRevLocked?'none':'auto'}
        }),
        el('div', {style:{display:'flex',justifyContent:'space-between',fontSize:11,color:'var(--t3)',marginBottom:16}},
          ['£150k','£250k','£350k','£450k','£550k','£650k','£800k'].map(l=>el('span',{key:l},l))
        ),

        // What the goal means
        el('div', {style:{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(160px,1fr))',gap:10}},
          [
            {lbl:'Monthly avg',     val:fmtC(goalRev/12,0),         sub:'Peak: '+fmtC(goalRev*WEIGHTS[3],0)+' (Nov)'},
            {lbl:'Weekly avg',      val:fmtC(goalRev/52,0),         sub:'Flat weekly average'},
            {lbl:'Daily avg',       val:fmtC(goalRev/365,0),        sub:'Every day of the year'},
            {lbl:'Orders/day @'+fmtC(summary.avgAOV||33)+' AOV', val:ordersPerDay_cur.toFixed(1), sub:ordersPerDay_goal.toFixed(1)+' orders/day @ £'+GOALS.aov+' goal', col:'var(--amb)'},
            {lbl:'Sessions/day needed', val:fmt(Math.round(sessPerDay_goal)), sub:'At 3.5% conv · '+fmt(Math.round(sessPerDay_cur))+' at current', col:'var(--blu)'},
          ].map((item,i)=>
            el('div', {key:i,style:{background:'var(--s2)',borderRadius:'var(--r)',padding:'12px 14px',border:'1px solid var(--bdr)'}},
              el('div', {className:'lbl',style:{marginBottom:5}}, item.lbl),
              el('div', {style:{fontSize:20,fontWeight:600,color:item.col||'var(--t1)',fontFamily:"'DM Mono',monospace",marginBottom:2}}, item.val),
              el('div', {style:{fontSize:11,color:'var(--t3)',lineHeight:1.4}}, item.sub)
            )
          )
        ),

        // Mini chart
        el('div', {style:{marginTop:14,paddingTop:14,borderTop:'1px solid var(--bdr)'}},
          el('div', {className:'lbl',style:{marginBottom:4}}, 'Monthly revenue vs target  ',
            el('span',{style:{color:'var(--grn)',fontWeight:400}}, '█ actual'),
            '  ',el('span',{style:{color:'#fff',fontWeight:400}}, '░ target')
          ),
          el(MiniBar, {months:monthly, goalRev})
        )
      ),

      // ══ OVERVIEW ════════════════════════════════════════════
      activeTab==='overview' && el('div', {className:'fi'},

        // Metric cards
        el('div', {style:{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(170px,1fr))',gap:12,marginBottom:16},className:'grid-auto'},

          el(MetricCard, {
            icon:'ti-current-location', label:'Sessions', accentCol:'var(--blu)',
            actual: summary.ytdSessions ? fmt(summary.ytdSessions) : 'Not tracked',
            target: fmt(GOALS.sessions), unit:'/year',
            statusKey: summary.ytdSessions ? status(summary.ytdSessions, GOALS.sessions) : 'pending',
            note: summary.ytdSessions ? null : 'Shopify Analytics pipeline active — sessions appear after first nightly run',
          }),

          el(MetricCard, {
            icon:'ti-percentage', label:'Conversion', accentCol:'var(--pur)',
            actual: convActual ? fmtP(convActual) : '—',
            target: fmtP(GOALS.conversion),
            statusKey: convActual ? status(convActual, GOALS.conversion) : 'pending',
            note: convActual ? null : 'Requires Shopify Analytics sessions data',
          }),

          el(MetricCard, {
            icon:'ti-receipt', label:'Avg Order Value', accentCol:'var(--grn)',
            actual: fmtC(summary.avgAOV,2), target: fmtC(GOALS.aov),
            statusKey: status(summary.avgAOV, GOALS.aov),
            note: 'Gap: '+fmtC(GOALS.aov - (summary.avgAOV||0), 2)+' · Revenue impact at current volume: +'+fmtC(((GOALS.aov-(summary.avgAOV||33))*summary.ytdOrders),0),
          }),

          el(MetricCard, {
            icon:'ti-shopping-bag', label:'Orders', accentCol:'var(--amb)',
            actual: fmt(summary.ytdOrders), target: fmt(Math.round(ytdGoal / GOALS.aov)),
            statusKey: status(summary.ytdOrders, ytdGoal / GOALS.aov),
            note: 'YTD orders vs implied target at £'+GOALS.aov+' goal AOV · matches Orders/day on the goal slider above',
          }),

          el(MetricCard, {
            icon:'ti-refresh', label:'Repeat Rate', accentCol:'var(--amb)',
            actual: fmtP(summary.avgRepeatRate), target: fmtP(GOALS.repeatRate),
            statusKey: status(summary.avgRepeatRate, GOALS.repeatRate),
            note: fmtP(summary.avgRepeatRate)+' of orders from returning customers YTD',
          }),

          el(MetricCard, {
            icon:'ti-currency-pound', label:'Revenue YTD', accentCol:'var(--grn)',
            actual: fmtC(summary.ytdRevenue,0), target: fmtC(ytdGoal,0),
            statusKey: status(summary.ytdRevenue, ytdGoal*0.9),
            note: 'Aug 25 – May 26 · FY goal: '+fmtC(goalRev,0),
          }),

        ),

        // Channel mix — rolls up email attribution + list size into the whole-business view
        el('div', {style:{marginBottom:16,maxWidth:280}},
          el(ChannelMixCard, { es: (emailData || EMAIL_FALLBACK).summary })
        ),

        // AI analysis
        el('div', {className:'card'},
          el('div', {style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:aiInsight||showAI?16:0,flexWrap:'wrap',gap:10}},
            el('div', null,
              el('div', {style:{fontWeight:500,fontSize:14}}, 'AI Strategic Analysis'),
              el('div', {style:{fontSize:12,color:'var(--t2)',marginTop:2}}, 'Claude analyses your numbers and tells you where to focus')
            ),
            el('div', {style:{display:'flex',gap:8,alignItems:'center'}},
              !HARDCODED_KEY && !apiKey && el('button', {
                onClick:()=>setShowAI(v=>!v),
                style:{fontSize:12,padding:'5px 12px'}
              }, el('i',{className:'ti ti-key'}), ' Set API key'),
              el('button', {
                onClick:runAI, disabled:aiLoading,
                style:{background:aiLoading?'transparent':'var(--amb-bg)',color:aiLoading?'var(--t3)':'var(--amb)',borderColor:aiLoading?'var(--bdr)':'var(--amb-bdr)'}
              },
                aiLoading ? el('span',{className:'spin'},'⟳') : el('i',{className:'ti ti-cpu'}),
                aiLoading ? ' Analysing…' : ' Get insight'
              )
            )
          ),

          // API key input
          showAI && !apiKey && el('div', {style:{marginBottom:12,display:'flex',gap:8}},
            el('input', {type:'password',placeholder:'sk-ant-...',value:keyIn,onChange:e=>setKeyIn(e.target.value),onKeyDown:e=>e.key==='Enter'&&(setApiKey(keyIn),setShowAI(false)),style:{maxWidth:340}}),
            el('button', {onClick:()=>{setApiKey(keyIn);setShowAI(false);},style:{whiteSpace:'nowrap'}}, 'Save & run')
          ),

          aiErr && el('div', {style:{fontSize:12,color:'var(--red)',padding:'10px 14px',background:'var(--red-bg)',borderRadius:'var(--r)',border:'1px solid var(--red-bdr)'}}, aiErr),
          aiInsight && el('div', {style:{fontSize:13,color:'var(--t1)',lineHeight:1.8,whiteSpace:'pre-wrap',padding:14,background:'var(--s2)',borderRadius:'var(--r)',border:'1px solid var(--bdr2)'}}, aiInsight),
          !aiInsight && !aiLoading && !showAI && el('div', {style:{fontSize:12,color:'var(--t3)',padding:'20px 0',textAlign:'center'}},
            'Click "Get insight" to analyse your ',(viewData?.fy||''),' performance against the ',fmtC(goalRev,0),' goal.'
          )
        )
      ),

      // ══ YESTERDAY ═══════════════════════════════════════════
      activeTab==='yesterday' && el('div', {className:'fi'},
        el('div', {className:'card',style:{marginBottom:16}},
          el('div', {style:{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:12,flexWrap:'wrap'}},
            el('div', null,
              el('div', {className:'lbl',style:{marginBottom:4}}, 'Yesterday performance'),
              el('div', {style:{fontSize:24,fontWeight:700,color:'var(--amb)',fontFamily:"'DM Mono',monospace",lineHeight:1.1}}, dateLabel(yesterday?.date)),
              el('div', {style:{fontSize:12,color:'var(--t3)',marginTop:6,lineHeight:1.5}},
                'Shopify Analytics total_sales for revenue/orders/AOV · Shopify Analytics sessions report for sessions/conversion · targets follow the revenue goal slider'
              )
            ),
            el('div', {style:{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}},
              el('div', {className:'badge bb'}, 'daily targets'),
              (yesterday?.margin==null) && el('div', {className:'badge ba'}, 'margin pending')
            )
          )
        ),
        yesterday ? el('div', {style:{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(190px,1fr))',gap:12,marginBottom:16},className:'grid-auto'},
          el(YesterdayCard, {
            icon:'ti-currency-pound', label:'Revenue', accentCol:'var(--grn)',
            actual: fmtC(yesterday.revenue,0), target: fmtC(yRevTarget,0),
            statusKey: status(yesterday.revenue, yRevTarget),
            note: 'Uses Shopify current_subtotal_price, matching the daily order fetcher.',
          }),
          el(YesterdayCard, {
            icon:'ti-shopping-bag', label:'Orders', accentCol:'var(--amb)',
            actual: fmt(yesterday.orders), target: fmt(yOrdersTarget,1),
            statusKey: status(yesterday.orders, yOrdersTarget),
            note: 'Target is revenue daily target divided by £48 goal AOV.',
          }),
          el(YesterdayCard, {
            icon:'ti-current-location', label:'Sessions', accentCol:'var(--blu)',
            actual: fmt(yesterday.sessions), target: fmt(ySessionsTarget,0),
            statusKey: status(yesterday.sessions, ySessionsTarget),
            note: 'Pulled directly from Shopify Analytics sessions.',
          }),
          el(YesterdayCard, {
            icon:'ti-percentage', label:'Conversion rate', accentCol:'var(--pur)',
            actual: yesterday.conversionRate!=null ? fmtP(yesterday.conversionRate) : '—',
            target: fmtP(GOALS.conversion),
            statusKey: yesterday.conversionRate!=null ? status(yesterday.conversionRate, GOALS.conversion) : 'pending',
            note: fmtP(yesterday.conversionRate)+' of '+fmt(yesterday.sessions)+' sessions converted.',
          }),
          el(YesterdayCard, {
            icon:'ti-receipt', label:'AOV', accentCol:'var(--grn)',
            actual: fmtC(yesterday.aov,2), target: fmtC(GOALS.aov,0),
            statusKey: status(yesterday.aov, GOALS.aov),
            note: 'Pulled directly from Shopify Analytics average_order_value.',
          }),
          el(YesterdayCard, {
            icon:'ti-refresh', label:'Repeat rate', accentCol:'var(--amb)',
            actual: fmtP(yesterday.repeatRate), target: fmtP(GOALS.repeatRate),
            statusKey: status(yesterday.repeatRate, GOALS.repeatRate),
            note: fmt(yesterday.returning)+' returning of '+fmt(yesterday.customers)+' order customers.',
          }),
          el(YesterdayCard, {
            icon:'ti-percentage', label:'Margin', accentCol:'var(--pur)',
            actual: yesterday.margin==null?'Pending':fmtP(yesterday.margin),
            target: fmtP(GOALS.margin),
            statusKey: yesterday.margin==null?'pending':status(yesterday.margin, GOALS.margin),
            note: 'Requires SKU cost/margin data before this can be calculated safely.',
          }),
          el(YesterdayCard, {
            icon:'ti-chart-pie', label:'Profit', accentCol:'var(--pur)',
            actual: yesterday.profit==null?'Pending':fmtC(yesterday.profit,0),
            target: fmtC(yProfitTarget,0),
            statusKey: yesterday.profit==null?'pending':status(yesterday.profit, yProfitTarget),
            note: 'Target is daily revenue target × 45% margin goal.',
          })
        ) : el('div', {className:'card',style:{textAlign:'center',padding:'28px 20px'}},
          el('div', {style:{fontWeight:600,marginBottom:6}}, 'Yesterday data not available yet'),
          el('div', {style:{fontSize:12,color:'var(--t3)'}}, 'Run Fetch Dashboard Data once after this update deploys.')
        ),
      ),

      // ══ MONTHLY ═════════════════════════════════════════════
      activeTab==='monthly' && el('div', {className:'fi'},
        el('div', {className:'card'},
          el('div', {style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16,flexWrap:'wrap',gap:10}},
            el('div', null,
              el('div', {style:{fontWeight:500,fontSize:14}}, (viewData?.fy||'')+' Monthly Performance'),
              el('div', {style:{fontSize:12,color:'var(--t2)',marginTop:2}}, (viewData?.fyLabel||'')+'  ·  Target scales with goal slider above')
            ),

            {lbl:'Cost data coverage',     val: summary.ytdCostCoverage!=null?fmtP(summary.ytdCostCoverage,0):'—', note:'Share of net sales with a costed SKU'},
          ].map((item,i)=>
            el('div', {key:i,className:'card'},
              el('div', {className:'lbl',style:{marginBottom:8}}, item.lbl),
              el('div', {style:{fontSize:28,fontWeight:700,color:'var(--t1)',fontFamily:"'DM Mono',monospace"}}, item.val),
              el('div', {style:{fontSize:12,color:'var(--t3)',marginTop:6}}, item.note)
            )
          )
        ),
        (() => {
          const lc = ltvCacData || LTV_CAC_FALLBACK;
          const goals = lc.goals;

          const renderWindow = (title, desc, w) => {
            const hasRatio = w.ratio != null;
            const ratioCol = !hasRatio ? 'var(--t3)' : w.ratio >= goals.targetRatio ? 'var(--grn)' : w.ratio >= goals.minRatio ? 'var(--amb)' : 'var(--red)';
            const ratioBadge = !hasRatio
              ? { cls: 'badge bb', text: 'pending' }
              : w.ratio >= goals.targetRatio ? { cls: 'badge bg', text: 'on track' }
              : w.ratio >= goals.minRatio    ? { cls: 'badge ba', text: 'below target' }
              :                                { cls: 'badge br', text: 'losing money' };
            const metaMissing   = w.adSpend.meta.spend   == null;
            const googleMissing = w.adSpend.google.spend == null;

            return el('div', { className: 'card', style: { marginBottom: 16 } },
              el('div', { style: { display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', gap: 12, flexWrap: 'wrap', marginBottom: 16 } },
                el('div', null,
                  el('div', { style: { fontWeight: 500, fontSize: 14, marginBottom: 4 } }, title),
                  el('div', { style: { fontSize: 12, color: 'var(--t2)', lineHeight: 1.5, maxWidth: 480 } },
                    w.window.monthsUsed
                      ? desc(w) + ' · blended CAC = all ad spend ÷ new customers · LTV = AOV × orders/customer × margin %'
                      : 'Waiting on the first LTV:CAC data pull'
                  )
                ),
                el('div', { className: ratioBadge.cls }, ratioBadge.text)
              ),

              (metaMissing || googleMissing) && el('div', {
                style: { background: 'var(--amb-bg)', border: '1px solid var(--amb-bdr)', borderRadius: 'var(--r)', padding: '10px 14px', marginBottom: 16, fontSize: 12, color: 'var(--amb)', lineHeight: 1.6 }
              },
                'Ad spend not fully connected yet — ',
                metaMissing && 'Meta (' + w.adSpend.meta.source + ')',
                metaMissing && googleMissing && ' and ',
                googleMissing && 'Google Ads (' + w.adSpend.google.source + ')',
                '. CAC and the ratio populate once API credentials are added as GitHub secrets.'
              ),

              el('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(180px,1fr))', gap: 12 } },
                [
                  {
                    lbl: 'LTV',
                    val: w.ltv != null ? fmtC(w.ltv, 0) : '—',
                    col: 'var(--grn)',
                    note: w.customerMetrics.avgAOV != null
                      ? fmtC(w.customerMetrics.avgAOV, 2) + ' AOV × ' + w.customerMetrics.ordersPerCustomer + ' orders/customer × ' + fmtP(w.customerMetrics.marginPct, 0) + ' margin'
                      : 'Needs costed-SKU margin data',
                  },
                  {
                    lbl: 'CAC (blended)',
                    val: w.cac != null ? fmtC(w.cac, 0) : '—',
                    col: 'var(--amb)',
                    note: w.adSpend.blended != null
                      ? fmtC(w.adSpend.blended, 0) + ' spend ÷ ' + fmt(w.customerMetrics.newCustomers) + ' new customers'
                      : 'Needs ad spend data',
                  },
                  {
                    lbl: 'LTV : CAC ratio',
                    val: hasRatio ? w.ratio.toFixed(1) + ' : 1' : '—',
                    col: ratioCol,
                    note: 'Target 3:1 · below 1:1 means each customer costs more than they bring in',
                  },
                ].map((item, i) =>
                  el('div', { key: i, style: { background: 'var(--s2)', borderRadius: 'var(--r)', padding: '14px 16px', border: '1px solid var(--bdr)' } },
                    el('div', { className: 'lbl', style: { marginBottom: 8 } }, item.lbl),
                    el('div', { style: { fontSize: 26, fontWeight: 700, color: item.col, fontFamily: "'DM Mono',monospace", marginBottom: 6 } }, item.val),
                    el('div', { style: { fontSize: 11, color: 'var(--t3)', lineHeight: 1.5 } }, item.note)
                  )
                )
              )
            );
          };

          return el(React.Fragment, null,
            el('div', { style: { fontSize: 11, color: 'var(--t3)', marginBottom: 8 } },
              'Both cards below are always as-of-today (rolling 12 months / cumulative up to 3 years) — they don\'t change with the FY tab selected above, unlike everything else on this page.'
            ),
            renderWindow(
              'LTV : CAC — rolling 12 months',
              w => 'Trailing ' + w.window.monthsUsed + ' completed month' + (w.window.monthsUsed === 1 ? '' : 's') + ' (' + w.window.since + ' → ' + w.window.until + ')',
              lc.rolling
            ),
            renderWindow(
              'LTV : CAC — cumulative',
              w => w.window.monthsUsed + ' of up to ' + w.window.monthsCap + ' months (' + w.window.since + ' → ' + w.window.until + ')' +
                (w.window.monthsUsed < w.window.monthsCap ? ' — will extend toward a full 3-year lifetime view as more history builds up' : ''),
              lc.cumulative
            )
          );
        })(),

        el('div', {className:'card'},
          el('div', {style:{fontWeight:500,marginBottom:12}}, 'Monthly margin breakdown'),
          el('div', {className:'table-scroll-hint', style:{alignItems:'center',gap:5,fontSize:11,color:'var(--t3)',marginBottom:6}},
            el('i', {className:'ti ti-arrows-horizontal', style:{fontSize:12}}),
            el('span', null, 'Swipe to see more columns')
          ),
          el('div', {className:'scroll-x-fade', style:{overflowX:'auto'}},
          el('table', {style:{width:'100%',borderCollapse:'collapse',fontSize:13,minWidth:600}},
            el('thead', null,
              el('tr', {style:{borderBottom:'1px solid var(--bdr2)'}},
                ['Month','Net sales','COGS (costed)','Margin % (costed)','Cost coverage','Est. gross profit'].map((h,i)=>
                  el('th', {key:i,style:{padding:'8px 12px',textAlign:i===0?'left':'right',fontSize:10,textTransform:'uppercase',color:'var(--t3)',letterSpacing:'0.07em'}}, h)
                )
              )
            ),
            el('tbody', null,
              monthly.filter(m=>!m.future).map((m,i)=>
                el('tr', {key:i,style:{borderBottom:'1px solid var(--bdr)'}},
                  el('td',{style:{padding:'9px 12px',fontWeight:500}}, m.label),
                  el('td',{style:{padding:'9px 12px',textAlign:'right',fontFamily:"'DM Mono',monospace"}}, m.netSales!=null?fmtC(m.netSales,0):'—'),
                  el('td',{style:{padding:'9px 12px',textAlign:'right',fontFamily:"'DM Mono',monospace"}}, m.costOfGoodsSold!=null?fmtC(m.costOfGoodsSold,0):'—'),
                  el('td',{style:{padding:'9px 12px',textAlign:'right',fontFamily:"'DM Mono',monospace",color:m.marginPctCovered!=null?'var(--grn)':'var(--t3)'}}, m.marginPctCovered!=null?fmtP(m.marginPctCovered,1):'—'),
                  el('td',{style:{padding:'9px 12px',textAlign:'right',fontFamily:"'DM Mono',monospace",color:m.costCoverage!=null&&m.costCoverage<0.5?'var(--amb)':'var(--t2)'}}, m.costCoverage!=null?fmtP(m.costCoverage,0):'—'),
                  el('td',{style:{padding:'9px 12px',textAlign:'right',fontFamily:"'DM Mono',monospace"}}, m.estGrossProfit!=null?fmtC(m.estGrossProfit,0):'—'),
                )
              )
            )
          )
          )
        )
      )

    ), // end content

    // FOOTER
    el('div', {style:{borderTop:'1px solid var(--bdr)',padding:'10px 20px',display:'flex',alignItems:'center',justifyContent:'space-between',background:'var(--s1)',flexWrap:'wrap',gap:8}},
      el('div', {style:{fontSize:11,color:'var(--t3)'}},
        'Rock On Ruby · Growth Dashboard · '+(viewData?.fy||'')+' · Total sales · ',
        isFallback
          ? el('span', {style:{color:'var(--amb)'}}, 'Showing embedded data — live updates nightly at 5am BST once GitHub Action is running correctly')
          : el('span', {style:{color:'var(--grn)'}},
              'Last updated: ',
              updatedAt ? updatedAt.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'}) +
              ' at ' + updatedAt.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}) + ' · Next update: 5am BST' : '—'
            )
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
